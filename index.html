  }
  function closeWiz(restore) {
    wiz = null;
    renderWiz();
    if (restore !== false && lastFocus && document.contains(lastFocus)) focusEl(lastFocus);
    lastFocus = null;
  }
  function deleteFlight(id) {
    const r = state.rows.find((x) => x.id === id);
    if (!r || !guard()) return;
    const patch = { [id]: { deleted: true, updatedAt: Date.now() } };
    applyLocal(r._doc, patch);
    sheet = null;
    renderSheet();
    render();
    toast("Flight deleted");
    writeYear(r._doc, patch);
  }
  function setCopied(r, value) {
    const patch = { [r.id]: { copied: value, updatedAt: Date.now() } };
    applyLocal(r._doc, patch);
    writeYear(r._doc, patch);
  }
  function toggleCopied(id) {
    if (!guard()) return;
    const r = state.rows.find((x) => x.id === id);
    if (!r) return;
    setCopied(r, !r.copied);
    renderHeader();
    renderMain();
    document.querySelectorAll(".tick").forEach((b) => { if (b.dataset.id === id) b.classList.add("pop"); });
  }
  function markMonthCopied() {
    if (!guard()) return;
    const months = bookMonths();
    const mo = months[currentMonthIndex(months)];
    if (!mo) return;
    const todo = mo.rows.filter((r) => !r.copied);
    if (!todo.length) return;
    const now = Date.now();
    const byDoc = {};
    for (const r of todo) (byDoc[r._doc] = byDoc[r._doc] || {})[r.id] = { copied: true, updatedAt: now };
    for (const [doc, patch] of Object.entries(byDoc)) applyLocal(doc, patch);
    render();
    toast(`${plural(todo.length, "flight", "flights")} marked as copied`);
    for (const [doc, patch] of Object.entries(byDoc)) writeYear(doc, patch);
  }

  /* ---------------- Copy mode: one line at a time ---------------- */
  function startCopy() {
    if (!state.settings || !guard()) return;
    const steps = L.copyList(state.rows).map((id) => ({ kind: "line", id }));
    if (!steps.length) { toast("Nothing to copy. Every flight is in the book."); return; }
    lastFocus = document.activeElement;
    copyRun = { steps, i: 0, done: false, marked: new Set() };
    renderCopy();
  }
  function renderCopy() {
    const root = document.getElementById("copy-root");
    if (!copyRun) { root.innerHTML = ""; lockScroll(); return; }
    const { steps, i } = copyRun;
    let body = "", nextLabel = "Next", prog = "";
    if (copyRun.done) {
      prog = "Done";
      body = `<p class="copy-where">All caught up</p>
        <div class="copy-side"><p>${plural(copyRun.marked.size, "flight", "flights")} marked as copied.</p></div>`;
    } else {
      const st = steps[i];
      if (st.kind === "line") {
        const r = state.rows.find((x) => x.id === st.id);
        prog = `Flight ${i + 1} of ${steps.length}`;
        if (!r) {
          body = `<p class="copy-where">Deleted flight</p><div class="copy-side"><p>This flight was deleted. Skip it.</p></div>`;
        } else {
          const p = L.parts(r.date), c = L.rowCols(r);
          const fld = (label, value, cls) => `<div class="${cls || ""}"><dt>${label}</dt><dd>${value ? esc(value) : '<span class="blank">leave blank</span>'}</dd></div>`;
          body = `<p class="copy-where">${esc(L.longDate(r.date))}${r.copied ? ' <span class="pill pill-ok">✓ Copied</span>' : ""}</p>
            <section class="copy-side"><h3>Flying page <span>left side</span></h3>
              <dl class="copy-grid">
                ${fld("Month", p.month)}${fld("Date", p.day)}${fld("Type &amp; Mark", r.type)}${fld("No.", r.tail)}
                ${fld("Captain or 1st Pilot", L.captainOf(r), "half")}${fld("Co-Pilot, Pupil or Crew", L.crewOf(r), "half")}
                ${fld("Duty", r.duty, "full")}
              </dl></section>
            <section class="copy-side"><h3>Details page <span>right side</span></h3>
              <dl class="copy-cols">${L.COLS.map((k) => `<div class="${c[k] ? "" : "nil"}"><dt>${L.COL_INFO[k].n}</dt><dd>${c[k] ? L.fmtT(c[k]) : "–"}</dd></div>`).join("")}</dl>
              <p class="note">Columns with – stay blank, like (2), (5) and (9) to (13).</p></section>`;
          nextLabel = r.copied ? "Next" : "Copied, next line";
        }
      }
    }
    root.innerHTML = `
      <div class="copy" role="dialog" aria-modal="true" aria-labelledby="c-title">
        <div class="wrap copy-head">
          <div><h2 id="c-title" tabindex="-1">Copy to book</h2><span class="copy-prog">${prog}</span></div>
          <button class="btn ghost" type="button" data-act="copy-close">Close</button>
        </div>
        <div class="wrap copy-body">${body}</div>
        <div class="wrap copy-foot">
          ${copyRun.done
            ? `<button class="btn primary big" type="button" data-act="copy-close">Done</button>`
            : `<button class="btn" type="button" data-act="copy-back"${i === 0 ? " disabled" : ""}>Back</button><button class="btn primary big" type="button" data-act="copy-next">${nextLabel}</button>`}
        </div>
      </div>`;
    lockScroll();
    focusEl(document.getElementById("c-title"));
  }
  function copyNext() {
    if (!copyRun || copyRun.done) return;
    const st = copyRun.steps[copyRun.i];
    if (st.kind === "line") {
      const r = state.rows.find((x) => x.id === st.id);
      if (r && !r.copied) {
        if (!guard()) return;
        setCopied(r, true);
        copyRun.marked.add(r.id);
      }
    }
    if (copyRun.i < copyRun.steps.length - 1) copyRun.i++;
    else copyRun.done = true;
    renderCopy();
    renderHeader();
    renderMain();
  }
  function copyBack() {
    if (!copyRun) return;
    if (copyRun.done) copyRun.done = false;
    else copyRun.i = Math.max(0, copyRun.i - 1);
    renderCopy();
  }
  function closeCopy() {
    copyRun = null;
    renderCopy();
    if (lastFocus && document.contains(lastFocus)) focusEl(lastFocus);
    lastFocus = null;
  }

  /* ---------------- Export ---------------- */
  function backupObject() {
    return {
      app: "Flight Logbook", format: 1, exportedAt: new Date().toISOString(),
      settings: state.settings,
      flights: state.rows.map((f) => { const o = Object.assign({}, f); delete o._doc; return o; }),
    };
  }
  async function exportFile(kind) {
    if (!state.settings) return;
    if (!downloads) { toast("Downloads aren't available here. Use Copy all as text."); return; }
    const filename = `flight-logbook-${todayISO()}.${kind}`;
    const data = kind === "csv" ? "﻿" + L.toCSV(state.rows, state.settings) : JSON.stringify(backupObject(), null, 2);
    try {
      const res = await downloads.save({ filename, data });
      if (res && res.status === "saved") toast("File saved");
    } catch (e) {
      const c = e && e.code;
      if (c === "declined") return;
      toast(c === "rate_limited" ? "A save is already open. Finish that one first." : "Couldn't save the file here. Use Copy all as text.");
    }
  }
  // The full backup as text: for moving the logbook to another copy of the app.
  async function copyBackup() {
    if (!state.settings) return;
    const text = JSON.stringify(backupObject());
    try { await navigator.clipboard.writeText(text); toast("Backup copied. Paste it in Restore a backup."); }
    catch (e) { openRestore(text); }
  }
  // Restore panel. With `shown` text it only shows a backup to select and copy by hand.
  function openRestore(shown) {
    lastFocus = document.activeElement;
    restore = { text: "", err: "", parsed: null, shown: typeof shown === "string" ? shown : null };
    renderRestore();
  }
  function closeRestore() {
    restore = null;
    renderRestore();
    if (lastFocus && document.contains(lastFocus)) focusEl(lastFocus);
    lastFocus = null;
  }
  function renderRestore() {
    const root = document.getElementById("restore-root");
    if (!restore) { root.innerHTML = ""; lockScroll(); return; }
    let title = "Restore a backup", body = "", foot = "";
    if (restore.shown != null) {
      title = "Your backup";
      body = `<p class="hint">Copying isn't allowed here. Tap the box, Select All, then Copy. Then paste it in Restore a backup in the other app.</p>
        <textarea class="r-text" id="r-shown" readonly rows="8">${esc(restore.shown)}</textarea>`;
      foot = `<button class="btn primary" type="button" data-act="restore-close">Done</button>`;
    } else if (restore.parsed) {
      const p = restore.parsed, s = p.settings || {};
      const now = state.rows.length;
      body = `<div class="r-sum">
          ${p.exportedAt ? `<span>Backup made <b>${esc(L.longDate(p.exportedAt.slice(0, 10)))}</b></span>` : ""}
          <span><b>${p.count}</b> ${p.count === 1 ? "flight" : "flights"}${p.last ? `, the last on <b>${esc(L.longDate(p.last))}</b>` : ""}</span>
          ${L.validISO(s.asOf) ? `<span>Totals as of <b>${esc(L.longDate(s.asOf))}</b></span>` : ""}
        </div>
        <p class="warn">This replaces everything in this app${now ? ` (${plural(now, "flight", "flights")} now)` : ""} with the backup.</p>`;
      foot = `<button class="btn primary" type="button" data-act="restore-confirm">Replace with this backup</button><button class="btn" type="button" data-act="restore-back">Back</button>`;
    } else {
      body = `<p class="hint">Paste the backup text, or choose the backup file. Make one in the other app with Setup, Back up now or Copy backup as text.</p>
        <textarea class="r-text" id="r-text" rows="6" placeholder="Paste the backup here" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(restore.text)}</textarea>
        <label class="field" for="r-file">Or choose a backup file<input id="r-file" type="file" accept=".json,.txt,application/json,text/plain"></label>
        ${restore.err ? `<p class="err" role="alert">${esc(restore.err)}</p>` : ""}`;
      foot = `<button class="btn primary" type="button" data-act="restore-check">Next</button><button class="btn" type="button" data-act="restore-close">Cancel</button>`;
    }
    root.innerHTML = `
      <div class="scrim" data-act="restore-close"></div>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="r-title">
        <div class="panel-head"><h2 id="r-title" tabindex="-1">${title}</h2></div>
        <div class="panel-body">${body}</div>
        <div class="panel-foot">${foot}</div>
      </div>`;
    lockScroll();
    focusEl(document.getElementById("r-title"));
  }
  function checkRestore() {
    const ta = document.getElementById("r-text");
    if (ta) restore.text = ta.value;
    const p = L.parseBackup(restore.text);
    if (p.error) { restore.err = p.error; renderRestore(); return; }
    restore.err = "";
    restore.parsed = p;
    renderRestore();
  }
  // Replaces the logbook with the backup: settings, every year in it, and empties years it doesn't have.
  async function applyRestore() {
    const p = restore && restore.parsed;
    if (!p || !guard()) return;
    const jobs = [enqueue("settings", () => coll.doc("settings").set(p.settings))];
    for (const [id, y] of Object.entries(p.years)) { created.add(id); jobs.push(enqueue(id, () => coll.doc(id).set(y))); }
    for (const id of Object.keys(state.years)) {
      if (!p.years[id]) jobs.push(enqueue(id, () => coll.doc(id).set({ kind: "year", year: Number(id.slice(1)), flights: {} })));
    }
    try { await Promise.all(jobs); } catch (e) { failed(e); return; }
    restore = null;
    renderRestore();
    lastFocus = null;
    state.month = null;
    toast(`Backup restored · ${plural(p.count, "flight", "flights")}`);
    go("book");
  }
  async function copyText() {
    if (!state.settings) return;
    try { await navigator.clipboard.writeText(L.toCSV(state.rows, state.settings)); toast("Copied. Paste it into Excel or Notes."); }
    catch (e) { toast("Copying isn't allowed in this view."); }
  }

  /* ---------------- Month list (tap the month) ---------------- */
  function openMonths() {
    if (!state.settings) return;
    lastFocus = document.activeElement;
    monthsOpen = true;
    renderMonthsList();
  }
  function closeMonths() {
    monthsOpen = false;
    renderMonthsList();
    if (lastFocus && document.contains(lastFocus)) focusEl(lastFocus);
    lastFocus = null;
  }
  function renderMonthsList() {
    const root = document.getElementById("months-root");
    if (!monthsOpen) { root.innerHTML = ""; lockScroll(); return; }
    const months = bookMonths(), cur = currentMonthIndex(months), now = thisMonthKey();
    const items = months.map((mo, i) => {
      const n = mo.rows.length, todo = mo.rows.filter((r) => !r.copied).length;
      const st = !n ? "" : todo ? `<span class="pl-state todo">${todo} to copy</span>` : `<span class="pl-state done">Copied</span>`;
      const sub = [n ? plural(n, "flight", "flights") : "", mo.key === now ? "this month" : "", i === cur ? "showing" : ""].filter(Boolean).join(" · ");
      return `<li><button type="button" class="pl-item${n ? "" : " empty"}" data-act="goto-month" data-month="${mo.key}"${i === cur ? ' aria-current="true"' : ""}>` +
        `<span class="pl-num">${mo.month}<small>${mo.y}</small></span>` +
        `<span class="pl-main"><span class="pl-dates">${n ? L.fmtT(mo.sum.c7) + " h" : "No flights"}</span>${sub ? `<span class="pl-sub">${sub}</span>` : ""}</span>${st}</button></li>`;
    }).reverse().join("");
    root.innerHTML = `
      <div class="scrim" data-act="close-months"></div>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ml-title">
        <div class="panel-head"><h2 id="ml-title" tabindex="-1">Months</h2><button type="button" class="linkbtn" data-act="close-months">Close</button></div>
        <div class="panel-body pl-body"><ul class="pl">${items}</ul></div>
      </div>`;
    lockScroll();
    const curEl = root.querySelector('[aria-current="true"]');
    if (curEl && curEl.scrollIntoView) { try { curEl.scrollIntoView({ block: "nearest" }); } catch (e) { /* ignore */ } }
    focusEl(document.getElementById("ml-title"));
  }

  /* ---------------- Swipe between Flying and Details (phone layout) ---------------- */
  const oneSide = window.matchMedia ? window.matchMedia("(max-width: 999.98px)") : null;
  const calm = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  let sw = null;
  function setSide(side, dir) {
    state.side = side === "details" ? "details" : "flying";
    try { localStorage.setItem("logbook.side", state.side); } catch (err) { /* optional */ }
    renderTools();
    renderMain();
    if (!dir || calm()) return;
    const card = main.querySelector(".sheet-card." + state.side);
    if (!card) return;
    const cls = dir < 0 ? "enter-r" : "enter-l";
    card.classList.add(cls);
    card.addEventListener("animationend", () => card.classList.remove(cls), { once: true });
  }
  // Finger moving left (dx < 0) brings in Details; moving right brings back Flying.
  const sideTo = (dx) => (state.side === "flying" && dx < 0 ? "details" : state.side === "details" && dx > 0 ? "flying" : null);
  function snapBack(card) {
    card.style.transition = calm() ? "" : "transform 180ms ease-out";
    card.style.transform = "";
    setTimeout(() => { card.style.transition = ""; }, 200);
  }
  function dropSwipe() {
    const s = sw;
    sw = null;
    if (s && s.mode === "drag") { s.card.classList.remove("dragging"); snapBack(s.card); }
  }
  main.addEventListener("touchstart", (e) => {
    sw = null;
    if (state.view !== "book" || !state.settings || sheet || wiz || copyRun || monthsOpen) return;
    if (!oneSide || !oneSide.matches || e.touches.length !== 1) return;
    const card = e.target && e.target.closest ? e.target.closest(".sheet-card") : null;
    if (!card) return;
    const t = e.touches[0];
    if (t.clientX < 16 || t.clientX > window.innerWidth - 16) return; // leave the screen edges to the system
    sw = { x: t.clientX, y: t.clientY, t0: Date.now(), mode: null, card, wrap: e.target.closest(".table-wrap"), dx: 0 };
  }, { passive: true });
  main.addEventListener("touchmove", (e) => {
    if (!sw || sw.mode === "off") return;
    if (e.touches.length !== 1) { dropSwipe(); return; }
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.mode) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) >= Math.abs(dx)) { sw.mode = "off"; return; }
      const w = sw.wrap; // a wide table scrolls sideways first; the swipe takes over at its edge
      if (w && (dx < 0 ? w.scrollLeft + w.clientWidth < w.scrollWidth - 1 : w.scrollLeft > 0)) { sw.mode = "off"; return; }
      sw.mode = "drag";
      sw.card.classList.add("dragging");
    }
    e.preventDefault();
    sw.dx = sideTo(dx) ? dx : dx * 0.25;
    sw.card.style.transform = `translateX(${sw.dx}px)`;
  }, { passive: false });
  main.addEventListener("touchend", () => {
    const s = sw;
    sw = null;
    if (!s || s.mode !== "drag") return;
    s.card.classList.remove("dragging");
    const to = sideTo(s.dx);
    const w = s.card.offsetWidth || 1;
    const fast = Math.abs(s.dx) > 30 && Math.abs(s.dx) / Math.max(1, Date.now() - s.t0) > 0.45;
    if (!to || !(Math.abs(s.dx) > Math.min(80, w * 0.22) || fast)) { snapBack(s.card); return; }
    const out = s.dx < 0 ? -1 : 1;
    if (calm()) { setSide(to); return; }
    s.card.style.transition = "transform 130ms ease-in";
    s.card.style.transform = `translateX(${out * (w + 24)}px)`;
    setTimeout(() => setSide(to, out), 130);
  });
  main.addEventListener("touchcancel", dropSwipe);

  /* ---------------- Events ---------------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    switch (t.dataset.act) {
      case "view": go(t.dataset.view); break;
      case "month": {
        const months = bookMonths();
        const cur = months[currentMonthIndex(months)];
        const next = L.shiftMonth(cur.key, Number(t.dataset.dir) < 0 ? -1 : 1);
        if (next >= months[0].key) { state.month = next; renderMain(); }
        break;
      }
      case "this-month": state.month = null; renderMain(); break;
      case "look": applyLook(t.dataset.look, true); break;
      case "side": setSide(t.dataset.side); break;
      case "months": openMonths(); break;
      case "close-months": closeMonths(); break;
      case "goto-month": {
        if (/^\d{4}-\d{2}$/.test(t.dataset.month || "")) state.month = t.dataset.month;
        closeMonths();
        renderMain();
        try { window.scrollTo(0, 0); } catch (err) { /* ignore */ }
        break;
      }
      case "tick": toggleCopied(t.dataset.id); break;
      case "edit": openSheet("edit", t.dataset.id); break;
      case "add": openWizard(); break;
      case "w-next": wizNext(); break;
      case "w-back": wizBack(); break;
      case "w-all": wizAllFields(); break;
      case "w-pick": {
        const el = document.getElementById("w-in");
        if (el) el.value = t.dataset.value;
        wizNext();
        break;
      }
      case "w-role": if (wiz) { readWizInput(); wiz.v.role = t.dataset.value === "dual" ? "dual" : "solo"; wiz.dupOk = false; renderWiz(); } break;
      case "mark-month": markMonthCopied(); break;
      case "copy-start": startCopy(); break;
      case "copy-next": copyNext(); break;
      case "copy-back": copyBack(); break;
      case "copy-close": closeCopy(); break;
      case "year": state.statsYear = Number(t.dataset.year); renderMain(); break;
      case "export-csv": exportFile("csv"); break;
      case "export-json": exportFile("json"); break;
      case "copy-csv": copyText(); break;
      case "copy-json": copyBackup(); break;
      case "restore-open": openRestore(); break;
      case "restore-close": closeRestore(); break;
      case "restore-check": checkRestore(); break;
      case "restore-back": restore.parsed = null; renderRestore(); break;
      case "restore-confirm": applyRestore(); break;
      case "reconnect": if (coll) subscribe(); render(); break;
      case "close-sheet": closeSheet(); break;
      case "pick": pickChip(t); break;
      case "other": openOther(t.dataset.field); break;
      case "role": setToggle("role", t.dataset.value); break;
      case "more": toggleMore(); break;
      case "delete": readSheet(); sheet.confirmDelete = true; renderSheet(); focusEl(document.querySelector('[data-act="delete-cancel"]')); break;
      case "delete-cancel": readSheet(); sheet.confirmDelete = false; renderSheet(); break;
      case "delete-confirm": if (sheet) deleteFlight(sheet.id); break;
      default: break;
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (restore) { e.preventDefault(); closeRestore(); return; }
      if (monthsOpen) { e.preventDefault(); closeMonths(); return; }
      if (copyRun) { e.preventDefault(); closeCopy(); return; }
      if (wiz) { e.preventDefault(); closeWiz(); return; }
      if (sheet) { e.preventDefault(); closeSheet(); return; }
    }
    const t = e.target;
    if (e.key === "Enter" && wiz && t && t.id === "w-in") { e.preventDefault(); wizNext(); return; }
    // In the flight sheet, Return just closes the keyboard; saving stays a deliberate tap.
    if (e.key === "Enter" && t && t.matches && t.matches(".q-other input, #f-type")) { e.preventDefault(); t.blur(); return; }
    if ((e.key === "Enter" || e.key === " ") && t && t.matches && t.matches('tr[data-act="edit"], tr[data-act="add"]')) {
      e.preventDefault();
      if (t.dataset.act === "edit") openSheet("edit", t.dataset.id); else openWizard();
    }
  });
  // Tapping a shortcut, toggle or Next keeps the text box focused, so the keyboard stays up.
  document.addEventListener("mousedown", (e) => {
    const t = e.target;
    if (wiz && t && t.closest && t.closest(".wiz .keep")) e.preventDefault();
  });
  // On a computer, open the calendar on any click on the date (phones open it natively on tap).
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t && (t.id === "w-date-in" || t.id === "f-date") && typeof t.showPicker === "function" && window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
      try { t.showPicker(); } catch (err) { /* not allowed here */ }
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (restore && t && t.id === "r-file" && t.files && t.files[0]) {
      const reader = new FileReader();
      reader.onload = () => { if (!restore) return; restore.text = String(reader.result || ""); checkRestore(); };
      reader.onerror = () => { if (!restore) return; restore.err = "That file couldn't be read."; renderRestore(); };
      reader.readAsText(t.files[0]);
      return;
    }
    if (sheet && t && t.id === "f-date") { sheet.dupOk = false; clearSheetError(); updateLive(); }
    if (wiz && t && t.id === "w-date-in" && L.validISO(t.value) && coveredByTotals(t.value)) {
      t.value = wiz.v.date;
      toast(coveredMsg());
      return;
    }
    if (wiz && t && t.id === "w-date-in" && L.validISO(t.value) && t.value <= todayISO()) {
      readWizInput();
      wiz.v.date = t.value;
      wiz.dateOpen = false;
      wiz.dupOk = false;
      renderWiz();
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id === "flight-form") { e.preventDefault(); if (sheet && !sheet.confirmDelete) submitSheet(); }
    else if (e.target.id === "setup-form") { e.preventDefault(); saveSetup(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    if (sheet && t.closest("#flight-form")) { sheet.dupOk = false; clearSheetError(); updateLive(); }
    if (wiz && t.id === "w-in") {
      wiz.dupOk = false;
      const err = document.getElementById("w-err");
      if (err) { err.textContent = ""; err.className = "err"; }
      const steps = wizSteps(wiz.v);
      const btn = document.getElementById("w-next");
      if (btn) btn.textContent = steps.indexOf(wiz.step) === steps.length - 1 ? "Save" : "Next";
      updateWizLive();
    }
    if (t.closest("#setup-form")) { state.setupDirty = true; updateSetupCheck(); }
  });
  window.addEventListener("hashchange", () => {
    const h = (location.hash || "").slice(1);
    if (VIEWS.includes(h) && h !== state.view) {
      if (state.view === "setup") state.setupDirty = false;
      state.view = h;
      render();
    }
  });
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state.view === "stats" && state.conn === "ready") drawChart(); }, 150);
  });

  /* ---------------- Boot ---------------- */
  function start(data) {
    data = data || {};
    if (VIEWS.includes(data.view)) state.view = data.view;
    if (typeof data.month === "string") state.month = data.month;
    if (data.side === "flying" || data.side === "details") state.side = data.side;
    if (Number.isFinite(data.statsYear)) state.statsYear = data.statsYear;
    const h = (location.hash || "").slice(1);
    if (VIEWS.includes(h)) state.view = h;
    render();
    connect();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ view: state.view, month: state.month, side: state.side, statsYear: state.statsYear })); } catch (e) { /* optional */ }
  if (hot && typeof hot.ready === "function") hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
