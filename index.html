<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1>Flight Logbook</h1>
      <span class="sub" id="hdr-sub">Opening…</span>
    </div>
    <span class="sync" id="sync" data-s="wait" role="status">Connecting</span>
  </div>
  <nav class="wrap tabs" aria-label="Sections">
    <button class="tab" type="button" data-act="view" data-view="book">Book</button>
    <button class="tab" type="button" data-act="view" data-view="stats">Stats</button>
    <button class="tab" type="button" data-act="view" data-view="setup">Setup</button>
  </nav>
  <div class="wrap tools" id="tools" hidden></div>
</header>
<main id="main" class="wrap"></main>
<div id="sheet-root"></div>
<div id="copy-root"></div>
<div id="wiz-root"></div>
<div id="months-root"></div>
<div id="restore-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<datalist id="dl-type"></datalist>

<script>
/*LOGIC-START*/
const Logic = (() => {
  "use strict";
  // Used columns of the Details page, in book order. (2), (5), (9)-(13) stay blank.
  const COLS = ["c1", "c3", "c4", "c6", "c7", "c8", "c14"];
  const COL_INFO = {
    c1: { n: "(1)", name: "Day 1st Pilot" },
    c3: { n: "(3)", name: "Day Dual" },
    c4: { n: "(4)", name: "Night 1st Pilot" },
    c6: { n: "(6)", name: "Night Dual" },
    c7: { n: "(7)", name: "Total" },
    c8: { n: "(8)", name: "Captain" },
    c14: { n: "(14)", name: "F/A-18" },
  };
  const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const STEP = 1024;

  // All arithmetic is done in whole tenths of an hour, so totals never drift.
  const toT = (h) => { const n = Number(h); return Number.isFinite(n) ? Math.round(n * 10) : 0; };
  const fmtT = (t) => (t / 10).toFixed(1);
  const fmtBlank = (t) => (t ? fmtT(t) : "");
  const fmtTick = (v, step) => (step % 10 === 0 ? String(v / 10) : (v / 10).toFixed(1));
  const isHornet = (type) => /F\s*\/?\s*A\s*-?\s*18/i.test(String(type || ""));
  const captainOf = (f) => (f.role === "dual" ? String(f.captain || "") : "SELF");
  const crewOf = (f) => (f.role === "dual" ? "SELF" : "");

  function zero() { const o = {}; for (const c of COLS) o[c] = 0; return o; }
  function add(a, b) { const o = {}; for (const c of COLS) o[c] = (a[c] || 0) + (b[c] || 0); return o; }

  // Solo: (1)/(4) and Captain (8). Dual (anyone else aboard): (3)/(6), no Captain time.
  function rowCols(f) {
    const d = toT(f.day), n = toT(f.night), tot = d + n;
    const solo = f.role !== "dual";
    return {
      c1: solo ? d : 0, c3: solo ? 0 : d, c4: solo ? n : 0, c6: solo ? 0 : n,
      c7: tot, c8: solo ? tot : 0, c14: isHornet(f.type) ? tot : 0,
    };
  }
  function sumRows(rows) { return rows.reduce((acc, r) => add(acc, rowCols(r)), zero()); }
  function bfTenths(s) { const bf = (s && s.bf) || {}; const o = {}; for (const c of COLS) o[c] = toT(bf[c]); return o; }

  // Book order: by date; flights on the same date keep the order they were added in.
  const posOf = (r) => (Number.isFinite(r.pos) ? r.pos : 1e15 + (Number(r.createdAt) || 0));
  function sortRows(list) {
    return list.slice().sort((a, b) =>
      (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || posOf(a) - posOf(b) ||
      (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }
  // A new (or re-dated) flight goes after every flight already logged on the same date.
  function nextPos(rows, excludeId) {
    let max = 0;
    for (const r of rows) if (r.id !== excludeId && Number.isFinite(r.pos)) max = Math.max(max, r.pos);
    return Math.floor(max / STEP) * STEP + STEP;
  }

  // Month keys look like "2026-11"; they sort and compare as plain strings.
  const monthKey = (iso) => String(iso || "").slice(0, 7);
  function shiftMonth(key, n) {
    const y = Number(key.slice(0, 4)), m0 = Number(key.slice(5, 7)) - 1 + n;
    const yy = y + Math.floor(m0 / 12), mm = ((m0 % 12) + 12) % 12;
    return `${yy}-${String(mm + 1).padStart(2, "0")}`;
  }
  // The Book, one month at a time, for every month from `fromKey` to `toKey`, empty months too:
  // B/F = total before the month, the month itself, C/F = B/F + the month (= next month's B/F).
  // Rows must be in book order; flights before `fromKey` count into the first B/F.
  function buildMonths(rows, s, fromKey, toKey) {
    const out = [];
    let carry = bfTenths(s), i = 0;
    while (i < rows.length && monthKey(rows[i].date) < fromKey) { carry = add(carry, rowCols(rows[i])); i++; }
    for (let k = fromKey, n = 0; k <= toKey && n < 2400; k = shiftMonth(k, 1), n++) {
      const list = [];
      while (i < rows.length && monthKey(rows[i].date) === k) { list.push(rows[i]); i++; }
      const sum = sumRows(list), m = Number(k.slice(5, 7));
      out.push({ key: k, y: Number(k.slice(0, 4)), m, month: MONTHS[m - 1], rows: list, before: carry, sum, toDate: add(carry, sum), first: n === 0 });
      carry = add(carry, sum);
    }
    return out;
  }
  // Reads a backup made by "Back up now" or "Copy backup as text" (format 1).
  // Returns { settings, years, count, last, exportedAt } or { error }.
  function parseBackup(text) {
    let o;
    try { o = JSON.parse(String(text == null ? "" : text).trim()); } catch (e) { return { error: "That isn't a logbook backup. Paste the whole text, from { to }." }; }
    if (!o || typeof o !== "object" || o.app !== "Flight Logbook" || !o.settings || typeof o.settings !== "object" || !Array.isArray(o.flights)) {
      return { error: "That isn't a Flight Logbook backup." };
    }
    if (Number(o.format) > 1) return { error: "This backup is from a newer version of the app." };
    const years = {};
    let count = 0, last = "";
    for (const f of o.flights) {
      if (!f || typeof f !== "object" || !validISO(f.date) || typeof f.id !== "string" || !/^[A-Za-z0-9_-]{1,64}$/.test(f.id)) continue;
      const flight = Object.assign({}, f);
      delete flight.id; delete flight._doc;
      const y = "y" + f.date.slice(0, 4);
      (years[y] = years[y] || { kind: "year", year: Number(f.date.slice(0, 4)), flights: {} }).flights[f.id] = flight;
      count++;
      if (f.date > last) last = f.date;
    }
    const settings = Object.assign({}, o.settings, { kind: "settings" });
    return { settings, years, count, last, exportedAt: typeof o.exportedAt === "string" ? o.exportedAt : "" };
  }

  // Copy to book: the flights not yet copied, oldest first.
  const copyList = (rows) => rows.filter((r) => !r.copied).map((r) => r.id);

  function parts(iso) {
    const [y, m, d] = String(iso || "").split("-").map(Number);
    return { y, m, d, month: MONTHS[m - 1] || "", day: Number.isFinite(d) ? String(d) : "" };
  }
  function validISO(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return false;
    const { y, m, d } = parts(iso);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return y >= 1950 && y <= 2100 && dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  const dayNum = (iso) => { const { y, m, d } = parts(iso); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
  const isoOf = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  const addDays = (iso, n) => {
    const { y, m, d } = parts(iso);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, "0")}-${String(dt.getUTCDate()).padStart(2, "0")}`;
  };
  const longDate = (iso) => { const p = parts(iso); return `${p.d} ${p.month} ${p.y}`; };
  const shortDate = (iso) => { const p = parts(iso); return `${p.d} ${p.month}`; };

  function parseHours(str, maxTenths) {
    const s = String(str == null ? "" : str).trim().replace(",", ".");
    if (s === "") return { ok: true, t: 0, blank: true };
    if (/^\d*\.\d{2,}$/.test(s)) return { ok: false, error: "use one decimal place, like 1.4" };
    if (!/^\d*\.?\d?$/.test(s) || s === ".") return { ok: false, error: "use a number like 1.4" };
    const t = Math.round(parseFloat(s) * 10);
    if (!Number.isFinite(t)) return { ok: false, error: "use a number like 1.4" };
    if (t > maxTenths) return { ok: false, error: `${fmtT(maxTenths)} at most` };
    return { ok: true, t };
  }

  function recency(rows, today) {
    const T = dayNum(today);
    let last = null, lastNight = null, first = null, t30 = 0, n30 = 0, t90 = 0, n90 = 0;
    for (const r of rows) {
      if (!validISO(r.date)) continue;
      const tot = toT(r.day) + toT(r.night);
      if (tot <= 0) continue;
      const age = T - dayNum(r.date);
      if (age < 0) continue; // dated in the future
      if (!first || r.date < first.date) first = r;
      const later = (a) => !a || r.date > a.date || (r.date === a.date && posOf(r) > posOf(a));
      if (later(last)) last = r;
      if (toT(r.night) > 0 && later(lastNight)) lastNight = r;
      if (age < 30) { t30 += tot; n30++; }
      if (age < 90) { t90 += tot; n90++; }
    }
    return {
      last, lastNight, first,
      sinceLast: last ? T - dayNum(last.date) : null,
      sinceNight: lastNight ? T - dayNum(lastNight.date) : null,
      t30, n30, t90, n90,
      coverage: first ? T - dayNum(first.date) : 0,
    };
  }

  // Night currency: lapses after `nightLimit` days (default 45) without a night flight; warn in the last 7 days.
  // The Setup date is used until a later night flight is logged in the app.
  function nightStatus(rows, s, today) {
    const limit = Math.max(1, Math.round(Number(s && s.nightLimit) || 45));
    let last = null, source = null;
    for (const r of rows) {
      if (toT(r.night) > 0 && validISO(r.date) && r.date <= today && (!last || r.date > last)) last = r.date;
    }
    if (last) source = "app";
    const before = s && validISO(s.lastNightBefore) && s.lastNightBefore <= today ? s.lastNightBefore : null;
    if (before && (!last || before > last)) { last = before; source = "setup"; }
    if (!last) return { state: "none", limit };
    const since = dayNum(today) - dayNum(last);
    const left = limit - since;
    const until = addDays(last, limit);
    const state = left < 0 ? "lapsed" : left <= 7 ? "warn" : "ok";
    return { state, limit, last, source, since, left, until };
  }

  const normTail = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
  function findDuplicate(rows, cand, excludeId) {
    const t = toT(cand.day) + toT(cand.night);
    const ct = normTail(cand.tail);
    return rows.find((r) => r.id !== excludeId && r.date === cand.date && toT(r.day) + toT(r.night) === t &&
      (!ct || !normTail(r.tail) || normTail(r.tail) === ct)) || null;
  }

  // One-tap choices learned from recent flights: most used first, ties go to the most recent.
  function topValues(rows, get, k) {
    const m = new Map();
    rows.slice(-120).forEach((r, i) => {
      const raw = get(r);
      const v = String(raw == null ? "" : raw).trim();
      if (!v || v === "SELF") return;
      const o = m.get(v) || { n: 0, last: -1 };
      o.n++; o.last = i;
      m.set(v, o);
    });
    return [...m.entries()].sort((a, b) => b[1].n - a[1].n || b[1].last - a[1].last).slice(0, k).map((e) => e[0]);
  }
  function hourChips(rows, k) {
    k = k || 8;
    const top = topValues(rows, (r) => { const t = toT(r.day) + toT(r.night); return t > 0 ? String(t) : ""; }, k).map(Number);
    for (const d of [12, 13, 11, 14, 10, 15, 9, 16, 8]) { if (top.length >= k) break; if (!top.includes(d)) top.push(d); }
    return top.sort((a, b) => a - b);
  }
  // Shortcuts for one hours field (day or night): your most used values, topped up with defaults, sorted.
  function tenthChips(rows, get, k, defaults) {
    const top = topValues(rows, (r) => { const t = get(r); return t > 0 ? String(t) : ""; }, k).map(Number);
    for (const d of defaults || []) { if (top.length >= k) break; if (!top.includes(d)) top.push(d); }
    return top.sort((a, b) => a - b);
  }

  // Typed answers: reuse the spelling already in the logbook ("bfm" becomes "BFM").
  function matchKnown(value, list) {
    const n = String(value == null ? "" : value).trim().replace(/\s+/g, " ");
    if (!n) return "";
    const key = n.toUpperCase();
    const hit = (list || []).find((x) => String(x).trim().replace(/\s+/g, " ").toUpperCase() === key);
    return hit || n;
  }
  // Shortcuts while typing: values starting with what was typed first, then values containing it.
  function filterChips(list, typed) {
    const t = String(typed == null ? "" : typed).trim().toUpperCase();
    const all = (list || []).map(String);
    if (!t) return all.slice();
    const starts = all.filter((x) => x.toUpperCase().startsWith(t));
    const has = all.filter((x) => !x.toUpperCase().startsWith(t) && x.toUpperCase().includes(t));
    return starts.concat(has);
  }

  function monthly(rows, year) {
    const out = MONTHS.map((label, i) => ({ i, label, n: 0, day: 0, night: 0, total: 0 }));
    for (const r of rows) {
      const p = parts(r.date);
      if (p.y !== year || !out[p.m - 1]) continue;
      const o = out[p.m - 1], d = toT(r.day), n = toT(r.night);
      o.n++; o.day += d; o.night += n; o.total += d + n;
    }
    return out;
  }
  function yearly(rows) {
    const map = new Map();
    for (const r of rows) {
      const p = parts(r.date);
      if (!p.y) continue;
      const o = map.get(p.y) || { year: p.y, n: 0, day: 0, night: 0, total: 0 };
      const d = toT(r.day), n = toT(r.night);
      o.n++; o.day += d; o.night += n; o.total += d + n;
      map.set(p.y, o);
    }
    return [...map.values()].sort((a, b) => b.year - a.year);
  }
  function niceScale(maxT, target) {
    target = target || 4;
    if (!(maxT > 0)) return { step: 5, max: 10 };
    const raw = maxT / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const mult = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    let step = Math.max(1, Math.round(mult * mag));
    if (maxT >= 40 && step % 10 !== 0) step = Math.ceil(step / 10) * 10;
    return { step, max: Math.ceil(maxT / step) * step };
  }

  const safeText = (v) => { const s = String(v == null ? "" : v); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; };
  const csvCell = (v) => { const s = String(v == null ? "" : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  function toCSV(rows, s) {
    const head = ["Year", "Month", "Date", "Type & Mark", "No.", "Captain or 1st Pilot", "Co-Pilot / Pupil or Crew", "Duty"]
      .concat(COLS.map((c) => COL_INFO[c].n + " " + COL_INFO[c].name), ["Copied to book", "ISO date"]);
    const blank7 = ["", "", "", "", "", "", ""];
    const out = [head];
    const bf = bfTenths(s);
    out.push(blank7.concat([s && validISO(s.asOf) ? "Totals as of " + longDate(s.asOf) : "Totals before the app"], COLS.map((c) => fmtT(bf[c])), ["", ""]));
    rows.forEach((r) => {
      const p = parts(r.date), c = rowCols(r);
      out.push([p.y, p.month, p.day, safeText(r.type), safeText(r.tail), safeText(captainOf(r)), safeText(crewOf(r)), safeText(r.duty)]
        .concat(COLS.map((k) => (c[k] ? fmtT(c[k]) : "")), [r.copied ? "Yes" : "No", r.date]));
    });
    const end = add(bf, sumRows(rows));
    out.push(blank7.concat(["Total to date"], COLS.map((c) => fmtT(end[c])), ["", ""]));
    return out.map((line) => line.map(csvCell).join(",")).join("\r\n");
  }

  return {
    COLS, COL_INFO, MONTHS, toT, fmtT, fmtBlank, fmtTick, isHornet, captainOf, crewOf, zero, add, rowCols, sumRows,
    bfTenths, posOf, sortRows, nextPos, monthKey, shiftMonth, buildMonths, copyList, parseBackup,
    parts, validISO, dayNum, isoOf, addDays, longDate, shortDate, parseHours, recency, nightStatus,
    findDuplicate, topValues, hourChips, tenthChips, matchKnown, filterChips, monthly, yearly, niceScale, toCSV,
  };
})();
/*LOGIC-END*/
</script>

<script>
(() => {
  "use strict";
  const L = Logic;
  const VIEWS = ["book", "stats", "setup"];
  const main = document.getElementById("main");
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const todayISO = () => L.isoOf(new Date());
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  const state = {
    conn: "connecting", // connecting | ready | unavailable | error
    synced: false, stale: false, dead: null,
    settings: null, years: {}, serverDocs: new Set(), rows: [],
    view: "book", month: null, side: "flying", statsYear: null,
    pending: 0, setupDirty: false,
    mode: "claude", // claude = saved in the Claude account; phone = the home-screen app, saved on this phone
  };
  let coll = null, downloads = null, lastSnap = null, unsub = null, loadTimer = null, toastTimer = null;

  /* ---------------- Themes ---------------- */
  // sw = swatch colors shown in Setup: background, page, ink, pen (still to write), copied.
  const LOOKS = [
    { id: "ledger", name: "Ledger", note: "The original. Follows your phone's light or dark mode.", sw: ["#e4eceb", "#f8fbfa", "#0f1c1b", "#1a3cb5", "#13782f"] },
    { id: "paper", name: "Logbook Paper", note: "Ivory pages, dark ink, ballpoint blue.", sw: ["#ece2cb", "#fbf6ea", "#2a2118", "#1f3f8f", "#2f6b3a"],
      font: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" },
    { id: "cockpit", name: "Cockpit", note: "Black glass, green and cyan, like an MFD.", sw: ["#040706", "#09100c", "#b9f6c8", "#3fe6ff", "#36d46c"] },
    { id: "night", name: "Night Ops", note: "Dim red on black, kind to night vision.", sw: ["#000000", "#0a0101", "#e04848", "#ff6a5c", "#b8312a"] },
    { id: "desert", name: "Desert", note: "Sand, olive drab and stencil headings.", sw: ["#e6dbc2", "#f6f0e2", "#2a2a1e", "#8c4a12", "#4b5d23"],
      font: "https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Share+Tech+Mono&family=Stardos+Stencil:wght@400;700&display=swap" },
    { id: "clean", name: "Clean", note: "iPhone style. Follows your phone's light or dark mode.", sw: ["#f2f2f7", "#ffffff", "#1c1c1e", "#007aff", "#34c759"] },
    { id: "sunlight", name: "Sunlight", note: "High contrast, easy to read in bright sun.", sw: ["#ffffff", "#efefef", "#000000", "#0033cc", "#00701f"],
      font: "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" },
  ];
  const lookOf = (id) => LOOKS.find((x) => x.id === id) || LOOKS[0];
  let look = lookOf(document.documentElement.getAttribute("data-look") || "ledger").id;
  // Applies a theme now; with save, also stores it in settings so other devices follow.
  function applyLook(id, save) {
    const lk = lookOf(id);
    look = lk.id;
    const root = document.documentElement;
    if (lk.id === "ledger") root.removeAttribute("data-look"); else root.setAttribute("data-look", lk.id);
    let link = document.getElementById("look-font");
    if (lk.font) {
      if (!link) { link = document.createElement("link"); link.id = "look-font"; link.rel = "stylesheet"; document.head.appendChild(link); }
      if (link.getAttribute("href") !== lk.font) link.setAttribute("href", lk.font);
    } else if (link) link.remove();
    try { localStorage.setItem("logbook.look", lk.id); } catch (e) { /* optional */ }
    syncThemeColor();
    document.querySelectorAll(".look").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.look === lk.id)));
    if (save && state.settings && state.synced && (state.settings.look || "ledger") !== lk.id) {
      const obj = Object.assign({}, state.settings, { look: lk.id, updatedAt: Date.now() });
      state.settings = obj;
      writeSettings(obj);
    }
  }
  // The iPhone status bar takes the page's background colour.
  function syncThemeColor() {
    const meta = document.querySelector('meta[name="theme-color"]');
    if (!meta) return;
    const c = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
    if (c) meta.setAttribute("content", c);
  }
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor); } catch (e) { /* older browsers */ }
  applyLook(look, false);
  const lookCard = () => `<section class="card stack">
        <h2>Theme</h2>
        <p class="hint">Tap one to try it. It changes the look only; your logbook stays the same.</p>
        <div class="looks">${LOOKS.map((l) => `<button type="button" class="look" data-act="look" data-look="${l.id}" aria-pressed="${l.id === look}">` +
          `<span class="look-sw" aria-hidden="true">${l.sw.map((c) => `<i data-c="${c}"></i>`).join("")}</span>` +
          `<span class="look-name">${l.name}</span><span class="look-note">${l.note}</span></button>`).join("")}</div>
      </section>`;
  // Swatch colors are set through the DOM (no inline style attributes).
  function paintSwatches() { document.querySelectorAll(".look-sw i[data-c]").forEach((i) => { i.style.background = i.dataset.c; }); }
  const created = new Set();
  const queues = {};
  let sheet = null, copyRun = null, wiz = null, lastFocus = null, monthsOpen = false, restore = null;

  try { const sd = localStorage.getItem("logbook.side"); if (sd === "flying" || sd === "details") state.side = sd; } catch (e) { /* optional */ }

  /* ---------------- Data ----------------
     Private store: data/users/<you>/ holds "settings" + one document per year ("y2026") with that year's flights.
     Each change merges only the flights it touches, so two devices never overwrite each other's lines. */
  function ingest(snap) {
    let settings = null;
    const years = {}, docs = new Set();
    for (const d of snap.docs) {
      if (!d.exists) continue;
      docs.add(d.id);
      const data = d.data() || {};
      if (d.id === "settings") settings = data;
      else if (/^y\d{4}$/.test(d.id)) years[d.id] = data;
    }
    state.settings = settings;
    if (settings && settings.look && settings.look !== look) applyLook(settings.look, false);
    state.years = years;
    state.serverDocs = docs;
    recompute();
  }
  function recompute() {
    const byId = new Map();
    for (const [docId, y] of Object.entries(state.years)) {
      const fl = y && y.flights && typeof y.flights === "object" ? y.flights : {};
      for (const [id, f] of Object.entries(fl)) {
        if (!f || typeof f !== "object") continue;
        const cand = Object.assign({}, f, { id, _doc: docId });
        const prev = byId.get(id);
        const cu = Number(cand.updatedAt) || 0, pu = prev ? Number(prev.updatedAt) || 0 : -1;
        if (!prev || cu > pu || (cu === pu && prev.deleted && !cand.deleted)) byId.set(id, cand);
      }
    }
    const rows = [];
    for (const f of byId.values()) if (!f.deleted && L.validISO(f.date)) rows.push(f);
    state.rows = L.sortRows(rows);
  }
  function applyLocal(docId, patch) {
    const cur = state.years[docId] || { kind: "year", year: Number(docId.slice(1)), flights: {} };
    const flights = Object.assign({}, cur.flights || {});
    for (const [id, p] of Object.entries(patch)) flights[id] = Object.assign({}, flights[id] || {}, p);
    state.years = Object.assign({}, state.years, { [docId]: Object.assign({}, cur, { flights }) });
    recompute();
  }
  function enqueue(key, fn) {
    state.pending++;
    renderStatus();
    const run = (queues[key] || Promise.resolve()).then(() => fn(), () => fn());
    queues[key] = run.catch(() => {});
    return run.finally(() => { state.pending--; renderStatus(); });
  }
  async function retryOnce(fn) {
    try { return await fn(); } catch (e) {
      if (e && e.code === "unavailable") {
        await new Promise((r) => setTimeout(r, 300 + Math.random() * 700));
        return fn();
      }
      throw e;
    }
  }
  function writeYear(docId, patch) {
    if (!coll) return Promise.resolve(false);
    return enqueue(docId, async () => {
      const ref = coll.doc(docId);
      let exists = state.serverDocs.has(docId) || created.has(docId);
      if (!exists) { const s = await retryOnce(() => ref.get()); exists = !!s.exists; }
      if (exists) await retryOnce(() => ref.update({ flights: patch }));
      else { await retryOnce(() => ref.set({ kind: "year", year: Number(docId.slice(1)), flights: patch })); created.add(docId); }
    }).then(() => true, (e) => { failed(e); return false; });
  }
  function writeSettings(obj) {
    if (!coll) return Promise.resolve(false);
    return enqueue("settings", () => retryOnce(() => coll.doc("settings").set(obj))).then(() => true, (e) => { failed(e); return false; });
  }
  function failed(e) {
    const code = e && e.code;
    const msg = code === "quota_exceeded" ? "Couldn't save: your logbook storage is full."
      : code === "resource_exhausted" ? "Too many changes at once. Wait a moment, then try again."
      : ["revoked", "not_granted", "capability_disabled", "capability_removed"].includes(code) ? "Saving isn't allowed in this view."
      : code === "invalid_argument" ? "Couldn't save that change."
      : "Couldn't save. Check your connection and try again.";
    toast(msg);
    if (lastSnap) ingest(lastSnap);
    render();
  }

  /* ---------------- Connection ---------------- */
  /* ---------------- On-phone storage (the home-screen app from GitHub) ---------------- */
  // The same calls the app makes to Claude's db, kept in this browser's local storage.
  function phoneDb() {
    const KEY = "logbook.data.v1";
    let store = {};
    try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
    const listeners = [];
    const clone = (x) => JSON.parse(JSON.stringify(x));
    const merge = (a, b) => {
      for (const [k, v] of Object.entries(b)) {
        if (v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], v);
        else a[k] = clone(v);
      }
    };
    const save = () => {
      try { localStorage.setItem(KEY, JSON.stringify(store)); }
      catch (e) { const err = new Error("This phone's storage for the app is full."); err.code = "quota_exceeded"; throw err; }
    };
    const parentOf = (path) => path.split("/").slice(0, -1).join("/");
    const snapOf = (cp) => {
      const docs = Object.keys(store).filter((p) => p.startsWith(cp + "/") && !p.slice(cp.length + 1).includes("/")).sort()
        .map((p) => ({ id: p.slice(cp.length + 1), exists: true, data: () => clone(store[p]) }));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    const emit = (cp) => setTimeout(() => listeners.filter((l) => l.path === cp).forEach((l) => l.next(snapOf(cp))), 0);
    const db = {
      collection(path) {
        return {
          path,
          doc: (id) => db.doc(path + "/" + id),
          onSnapshot(next) {
            const l = { path, next };
            listeners.push(l);
            setTimeout(() => next(snapOf(path)), 0);
            return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); };
          },
        };
      },
      doc(path) {
        const id = path.split("/").pop();
        return {
          path, id,
          async get() { return { id, exists: path in store, data: () => (store[path] ? clone(store[path]) : undefined) }; },
          async set(d) {
            const before = store[path];
            store[path] = clone(d);
            try { save(); } catch (e) { if (before === undefined) delete store[path]; else store[path] = before; throw e; }
            emit(parentOf(path));
          },
          async update(d) {
            if (!(path in store)) { const err = new Error("missing"); err.code = "not_found"; throw err; }
            const before = clone(store[path]);
            merge(store[path], d);
            try { save(); } catch (e) { store[path] = before; throw e; }
            emit(parentOf(path));
          },
          async delete() { delete store[path]; save(); emit(parentOf(path)); },
        };
      },
    };
    return db;
  }
  // Files on the phone: the share sheet (Save to Files, iCloud Drive), or a plain download.
  const phoneFiles = {
    async save({ filename, data }) {
      const file = new File([data], filename, { type: filename.endsWith(".csv") ? "text/csv" : "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: filename }); return { status: "saved" }; }
        catch (e) { if (e && e.name === "AbortError") { const err = new Error("declined"); err.code = "declined"; throw err; } }
      }
      const url = URL.createObjectURL(file), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return { status: "saved" };
    },
  };
  const installed = () => !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone);
  // Home-screen icon, manifest and the offline worker: only for the phone version (not inside Claude).
  function setupHomeScreen() {
    const add = (attrs) => { const l = document.createElement("link"); for (const [k, v] of Object.entries(attrs)) l.setAttribute(k, v); document.head.appendChild(l); };
    add({ rel: "manifest", href: "manifest.webmanifest" });
    add({ rel: "apple-touch-icon", href: "icons/apple-touch-icon.png" });
    add({ rel: "icon", type: "image/png", sizes: "32x32", href: "icons/favicon-32.png" });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
    if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (had) toast("A new version of the app is ready.", { label: "Reload", fn: () => location.reload() });
    });
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(() => {});
  }
  function connectPhone() {
    state.mode = "phone";
    try { coll = phoneDb().collection("data/users/phone"); } catch (e) { state.conn = "error"; render(); return; }
    downloads = phoneFiles;
    setupHomeScreen();
    subscribe();
  }

  async function connect() {
    const api = window.claude;
    if (!api || typeof api.use !== "function") { connectPhone(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([api.use("db"), api.use("user")]); } catch (e) { db = null; }
    if (!db) { state.conn = "unavailable"; render(); return; }
    let uid = null;
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    if (!uid) { state.conn = "unavailable"; render(); return; }
    try { coll = db.collection("data/users/" + uid); } catch (e) { state.conn = "unavailable"; render(); return; }
    subscribe();
    Promise.resolve(api.use("downloads")).then((d) => {
      downloads = d || null;
      if (state.view === "setup" && !state.setupDirty) renderMain();
    }, () => {});
  }
  function subscribe() {
    if (unsub) { try { unsub(); } catch (e) { /* already closed */ } }
    state.dead = null;
    state.stale = false;
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => { if (!state.synced) { state.stale = true; render(); } }, 10000);
    unsub = coll.onSnapshot((snap) => {
      lastSnap = snap;
      ingest(snap);
      state.conn = "ready";
      if (!snap.metadata || !snap.metadata.fromCache) { state.synced = true; state.stale = false; clearTimeout(loadTimer); }
      render();
    }, (err) => {
      clearTimeout(loadTimer);
      state.dead = (err && err.code) || "unavailable";
      state.synced = false;
      if (state.conn !== "ready") state.conn = "error";
      render();
    });
  }

  /* ---------------- Helpers ---------------- */
  function nextTodoId() { const r = state.rows.find((x) => !x.copied); return r ? r.id : null; }
  const thisMonthKey = () => L.monthKey(todayISO());
  // The setup totals are "as of" this date: they include every flight up to the end of that day.
  // Flights in the app come after it.
  const asOfDate = () => (state.settings && L.validISO(state.settings.asOf) ? state.settings.asOf : "");
  const firstAllowed = () => (asOfDate() ? L.addDays(asOfDate(), 1) : "");
  const coveredByTotals = (date) => !!asOfDate() && date <= asOfDate();
  const coveredMsg = () => `Your setup totals already include flights up to ${L.longDate(asOfDate())}. Pick a later date.`;
  // Every month from the first one in the app (or this month) up to this month, or further
  // ahead when a later month is being viewed. Empty months are included.
  function bookMonths() {
    const now = thisMonthKey(), rows = state.rows;
    const firstFlight = rows.length ? L.monthKey(rows[0].date) : now;
    const lastFlight = rows.length ? L.monthKey(rows[rows.length - 1].date) : now;
    let first = firstFlight < now ? firstFlight : now;
    const start = firstAllowed() ? L.monthKey(firstAllowed()) : "";
    if (start && start < first) first = start;
    let last = lastFlight > now ? lastFlight : now;
    if (state.month && state.month > last) last = state.month;
    return L.buildMonths(rows, state.settings, first, last);
  }
  // The Book opens on this month; state.month is the month being viewed.
  function currentMonthIndex(months) {
    const want = state.month || thisMonthKey();
    const k = months.findIndex((m) => m.key === want);
    return k >= 0 ? k : want < months[0].key ? 0 : months.length - 1;
  }
  function guard() {
    if (!state.synced) { toast("Still connecting to your logbook. Try again in a moment."); return false; }
    return true;
  }
  function toast(msg, action) {
    const el = document.getElementById("toast");
    el.innerHTML = "";
    const span = document.createElement("span");
    span.textContent = msg;
    el.appendChild(span);
    if (action) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "toast-btn";
      b.textContent = action.label;
      b.addEventListener("click", () => { el.hidden = true; clearTimeout(toastTimer); action.fn(); });
      el.appendChild(b);
    }
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2800);
  }
  function focusEl(el) { if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } }
  function lockScroll() { document.body.style.overflow = sheet || copyRun || wiz || monthsOpen || restore ? "hidden" : ""; }
  function go(view) {
    if (!VIEWS.includes(view)) view = "book";
    if (state.view === "setup" && view !== "setup") state.setupDirty = false;
    state.view = view;
    try { if (location.hash !== "#" + view) location.hash = view; } catch (e) { /* hash not available */ }
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
  }

  /* ---------------- Render ---------------- */
  function render() { renderHeader(); renderMain(); renderStatus(); }
  function renderHeader() {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.view === state.view ? "page" : "false"));
    document.body.classList.toggle("wide", state.view === "book");
    let t = "";
    if (state.conn === "connecting") t = "Opening your logbook…";
    else if (state.conn !== "ready") t = "Not connected";
    else if (!state.settings) t = "Setup needed";
    else {
      const todo = state.rows.filter((r) => !r.copied).length;
      t = !state.rows.length ? "No flights yet" : todo ? `${plural(todo, "flight", "flights")} to copy into the book` : "All flights copied into the book";
    }
    document.getElementById("hdr-sub").textContent = t;
    renderTools();
  }
  function renderTools() {
    const el = document.getElementById("tools");
    const show = state.view === "book" && state.conn === "ready" && !!state.settings;
    el.hidden = !show;
    if (!show) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="seg side-toggle" role="group" aria-label="Side of the book">
        <button type="button" data-act="side" data-side="flying" aria-pressed="${state.side === "flying"}">Flying page</button>
        <button type="button" data-act="side" data-side="details" aria-pressed="${state.side === "details"}">Details page</button>
      </div>
      <button class="add-btn" type="button" data-act="add">+ Add flight</button>`;
  }
  function renderStatus() {
    const el = document.getElementById("sync");
    let s = "wait", t = "Connecting";
    if (state.conn === "unavailable" || state.conn === "error" || state.dead) { s = "bad"; t = "Not syncing"; }
    else if (state.pending > 0) { s = "saving"; t = "Saving…"; }
    else if (state.stale) { s = "bad"; t = "No connection"; }
    else if (state.synced) { s = "ok"; t = "Saved"; }
    el.dataset.s = s;
    el.textContent = t;
  }
  function renderMain() {
    if (state.view === "setup" && state.setupDirty) return;
    main.dataset.view = state.view;
    const keep = {};
    main.querySelectorAll(".table-wrap[data-k]").forEach((el) => { keep[el.dataset.k] = el.scrollLeft; });
    let html = "";
    if (state.stale && !state.synced) html += `<div class="banner"><span>Can't reach your logbook yet. It will load when the connection is back.</span></div>`;
    if (state.dead && state.conn === "ready") {
      html += `<div class="banner"><span>Live sync stopped, so new changes can't be saved.</span>${state.dead === "unavailable" ? '<button class="btn" type="button" data-act="reconnect">Reconnect</button>' : ""}</div>`;
    }
    if (state.conn === "connecting") {
      main.innerHTML = html + `<p class="empty-note">Opening your logbook…</p>`;
      return;
    }
    if (state.conn === "unavailable") {
      main.innerHTML = `<div class="card stack"><h2>Sign-in needed</h2><p class="hint">This logbook is saved in your Claude account, so it only opens inside Claude while you're signed in.</p></div>`;
      return;
    }
    if (state.conn === "error") {
      main.innerHTML = `<div class="card stack"><h2>Can't open your logbook</h2><p class="hint">Your saved logbook can't be reached from here right now.</p>${state.dead === "unavailable" ? '<div class="actions"><button class="btn primary" type="button" data-act="reconnect">Try again</button></div>' : ""}</div>`;
      return;
    }
    if (state.view === "stats") html += statsHTML();
    else if (state.view === "setup") html += setupHTML();
    else html += bookHTML();
    main.innerHTML = html;
    if (state.view === "stats") drawChart();
    if (state.view === "setup") { updateSetupCheck(); paintSwatches(); }
    main.querySelectorAll(".table-wrap[data-k]").forEach((el) => { if (keep[el.dataset.k]) el.scrollLeft = keep[el.dataset.k]; });
  }

  function setupPrompt() {
    return `${installCard()}<div class="card stack"><h2>Set up your logbook</h2>
      <p class="hint">Enter your logbook totals from before the app. You do this once. Moving from another copy of the app? Restore its backup instead.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="view" data-view="setup">Start setup</button><button class="btn" type="button" data-act="restore-open">Restore a backup</button></div></div>`;
  }
  // Phone version opened in Safari, not yet on the home screen.
  function installCard() {
    if (state.mode !== "phone" || installed()) return "";
    return `<div class="card stack"><h2>Install on your iPhone</h2>
      <p class="hint">In Safari, tap Share, then Add to Home Screen, then Add. Open Logbook from your home screen. The home-screen app keeps its own data, separate from Safari, so set it up or restore your backup inside the installed app.</p></div>`;
  }
  function nightBanner() {
    if (!state.settings) return "";
    const ns = L.nightStatus(state.rows, state.settings, todayISO());
    if (ns.state === "warn") {
      const left = ns.left === 0 ? "Today is the last day" : `${plural(ns.left, "day", "days")} left, until ${L.longDate(ns.until)}`;
      return `<div class="banner warn-b"><span><span class="ico ico-warn" aria-hidden="true">!</span><b>Night currency:</b> ${esc(left)}. Last night flight ${esc(L.longDate(ns.last))}.</span></div>`;
    }
    if (ns.state === "lapsed") {
      return `<div class="banner crit-b"><span><span class="ico ico-crit" aria-hidden="true">✕</span><b>Night currency lapsed</b> on ${esc(L.longDate(L.addDays(ns.until, 1)))}. Last night flight ${esc(L.longDate(ns.last))}.</span></div>`;
    }
    return "";
  }

  /* ---- Book ---- */
  function tick(r) {
    const what = `${L.shortDate(r.date)}${r.duty ? " " + r.duty : ""}`;
    return `<button class="tick" type="button" data-act="tick" data-id="${esc(r.id)}" aria-pressed="${r.copied ? "true" : "false"}" aria-label="${esc(what)}: ${r.copied ? "copied to book. Tap to undo" : "mark as copied to book"}">${r.copied ? "✓" : ""}</button>`;
  }
  function flyingRow(r, cls) {
    const p = L.parts(r.date);
    return `<tr class="line ${cls}" data-act="edit" data-id="${esc(r.id)}" tabindex="0">` +
      `<td class="c-line">${tick(r)}</td>` +
      `<td class="v c-mon">${esc(p.month)}</td>` +
      `<td class="v num c-date">${esc(p.day)}</td>` +
      `<td class="v c-type">${esc(r.type)}</td>` +
      `<td class="v c-no">${esc(r.tail)}</td>` +
      `<td class="v txt c-cap">${esc(L.captainOf(r))}</td>` +
      `<td class="v txt c-crew">${esc(L.crewOf(r))}</td>` +
      `<td class="v txt c-duty">${esc(r.duty)}</td></tr>`;
  }
  function detailsRow(r, cls) {
    const c = L.rowCols(r);
    return `<tr class="line ${cls}" data-act="edit" data-id="${esc(r.id)}" tabindex="0"><td class="c-line">${tick(r)}</td>` +
      L.COLS.map((k) => `<td class="v num c-val">${L.fmtBlank(c[k])}</td>`).join("") + `</tr>`;
  }
  const totCells = (o) => L.COLS.map((c) => `<td class="num c-val">${L.fmtT(o[c])}</td>`).join("");

  function bookHTML() {
    const s = state.settings;
    if (!s) return setupPrompt();
    const months = bookMonths();
    const mi = currentMonthIndex(months);
    const mo = months[mi];
    const now = thisMonthKey();
    const nextId = nextTodoId();
    const n = mo.rows.length;
    const todo = mo.rows.filter((r) => !r.copied).length;
    const allTodo = state.rows.filter((r) => !r.copied).length;
    const label = `${mo.month} ${mo.y}`;
    const meta = n
      ? `${plural(n, "flight", "flights")} · ${L.fmtT(mo.sum.c7)} h · ${todo ? todo + " still to write" : "all copied"}`
      : `${mo.key > now ? "No flights yet" : "No flights this month"}. B/F carries straight to C/F.`;
    const back = mo.key !== now ? ` <button class="linkbtn" type="button" data-act="this-month">Go to this month</button>` : "";
    // The month the setup totals stop in: B/F = those totals; the month counts only flights after them.
    const asOf = asOfDate();
    const startsHere = !!asOf && L.monthKey(firstAllowed()) === mo.key;
    const bfLabel = startsHere ? `Total brought forward · as of ${L.shortDate(asOf)}` : "Total brought forward";
    const monthLabel = startsHere && firstAllowed().slice(8) !== "01" ? `${label} · from ${L.shortDate(firstAllowed())}` : label;
    const nudge = asOf ? "" : `<div class="banner info"><span>Add the date your setup totals are from, so the book starts in the right month.</span><button class="btn" type="button" data-act="view" data-view="setup">Open Setup</button></div>`;

    let fly = "", det = "";
    for (const r of mo.rows) {
      const cls = (r.copied ? "done" : "todo") + (r.id === nextId ? " next" : "");
      fly += flyingRow(r, cls);
      det += detailsRow(r, cls);
    }
    if (!n) {
      fly = `<tr class="none-row"><td class="c-line"></td><td colspan="7" class="none">No flights in ${label}</td></tr>`;
      det = `<tr class="none-row"><td class="c-line"></td><td colspan="7" class="none">No flights</td></tr>`;
    }

    // Like the paper page: Total brought forward on top; the month and Total carried forward at the bottom.
    const flyTable = `<table class="ledger fly">
      <thead>
        <tr><th rowspan="2" class="c-line" scope="col"><span class="sr">Line</span></th><th colspan="2" scope="colgroup">Year</th><th colspan="2" scope="colgroup">Aircraft</th><th rowspan="2" class="c-cap" scope="col">Captain or 1st&nbsp;Pilot</th><th rowspan="2" class="c-crew" scope="col">Co-Pilot, Pupil or Crew</th><th rowspan="2" class="c-duty" scope="col">Duty</th></tr>
        <tr><th scope="col" class="c-mon">Month</th><th scope="col" class="c-date">Date</th><th scope="col" class="c-type">Type &amp; Mark</th><th scope="col" class="c-no">No.</th></tr>
      </thead>
      <tbody>
        <tr class="tot bf"><td class="c-line"></td><td class="dash">–</td><td class="dash">–</td><td class="dash">–</td><td class="dash">–</td><td class="dash">–</td><td class="dash">–</td><td class="lbl txt c-duty">${bfLabel}</td></tr>
        ${fly}
        <tr class="tot sum"><td class="c-line"></td><td colspan="6"></td><td class="lbl txt c-duty">${monthLabel}</td></tr>
        <tr class="tot cf"><td class="c-line"></td><td colspan="6"></td><td class="lbl txt c-duty">Total carried forward</td></tr>
      </tbody></table>`;

    const detTable = `<table class="ledger">
      <thead>
        <tr><th rowspan="2" class="c-line" scope="col"><span class="sr">Line</span></th><th colspan="2" scope="colgroup">Day flying</th><th colspan="2" scope="colgroup">Night flying</th><th colspan="2" scope="colgroup">Flight time</th><th scope="colgroup">Spare</th></tr>
        <tr><th scope="col">1st Pilot<b>(1)</b></th><th scope="col">Dual<b>(3)</b></th><th scope="col">1st Pilot<b>(4)</b></th><th scope="col">Dual<b>(6)</b></th><th scope="col">Total<b>(7)</b></th><th scope="col">Captain<b>(8)</b></th><th scope="col">F/A-18<b>(14)</b></th></tr>
      </thead>
      <tbody>
        <tr class="tot bf"><th scope="row" class="c-line lblc" title="${bfLabel}">B/F</th>${totCells(mo.before)}</tr>
        ${det}
        <tr class="tot sum"><th scope="row" class="c-line lblc" title="${monthLabel}">${mo.month}</th>${totCells(mo.sum)}</tr>
        <tr class="tot cf"><th scope="row" class="c-line lblc" title="Total carried forward">C/F</th>${totCells(mo.toDate)}</tr>
      </tbody></table>`;

    return `${nudge}${nightBanner()}
      <div class="book-bar">
        <div class="pager">
          <button class="navbtn" type="button" data-act="month" data-dir="-1" aria-label="Previous month"${mi === 0 ? " disabled" : ""}>‹</button>
          <button class="pg pg-btn" type="button" data-act="months" aria-haspopup="dialog" aria-label="${label}. Show all months"><span class="pg-label">${mo.y}</span><span class="pg-num" aria-live="polite">${mo.month}</span></button>
          <button class="navbtn" type="button" data-act="month" data-dir="1" aria-label="Next month">›</button>
        </div>
        <p class="pg-meta">${esc(meta)}${back}</p>
      </div>
      ${allTodo ? `<button class="btn primary copy-cta" type="button" data-act="copy-start">Copy to book · ${plural(allTodo, "flight", "flights")}</button>` : ""}
      <div class="book" data-side="${state.side}">
        <article class="sheet-card flying" aria-label="Flying page, ${label}">
          <div class="sheet-head"><h2 class="sheet-title">Flying</h2><span class="sheet-sub">${label}</span></div>
          <div class="table-wrap" data-k="fly">${flyTable}</div>
        </article>
        <article class="sheet-card details" aria-label="Details page, ${label}">
          <div class="sheet-head"><h2 class="sheet-title">Details</h2><span class="sheet-sub">Section 4 · leave (2) (5) (9)–(13) blank</span></div>
          <div class="table-wrap" data-k="det">${detTable}</div>
        </article>
      </div>
      <div class="legend"><span><i class="l-todo"></i>Still to write</span><span><i class="l-done"></i>Copied to book</span><span>Tap a line to edit it.</span><span class="swipe-hint">${state.side === "flying" ? "Swipe left for the Details page." : "Swipe right for the Flying page."}</span></div>
      ${todo ? `<div class="book-actions"><button class="btn" type="button" data-act="mark-month">Mark the rest of ${mo.month} as copied</button></div>` : ""}`;
  }

  /* ---- Stats ---- */
  function statsHTML() {
    if (!state.settings) return setupPrompt();
    const rows = state.rows;
    const today = todayISO();
    const rc = L.recency(rows, today);
    const ns = L.nightStatus(rows, state.settings, today);
    const yrs = L.yearly(rows);
    const thisYear = Number(today.slice(0, 4));
    if (state.statsYear == null || !yrs.some((y) => y.year === state.statsYear)) {
      state.statsYear = yrs.some((y) => y.year === thisYear) ? thisYear : yrs.length ? yrs[0].year : thisYear;
    }
    const days = (n) => (n === 0 ? "Today" : `${n}<small>${n === 1 ? "day" : "days"}</small>`);
    const tile = (label, value, sub, extra) => `<div class="tile"><span class="t-label">${label}</span><span class="t-value">${value}</span><span class="t-sub">${sub}</span>${extra || ""}</div>`;
    const pill = ns.state === "ok" ? `<span class="pill pill-ok">✓ Current</span>`
      : ns.state === "warn" ? `<span class="pill pill-warn">! Due soon</span>`
      : ns.state === "lapsed" ? `<span class="pill pill-bad">✕ Lapsed</span>` : "";
    // Night currency: days left until it's due (the last day a night flight keeps it current).
    const dueValue = ns.state === "none" ? "–" : ns.state === "lapsed" ? "Lapsed"
      : ns.left === 0 ? "Today" : `${ns.left}<small>${ns.left === 1 ? "day left" : "days left"}</small>`;
    const dueSub = ns.state === "none" ? "No night flight yet. Add your last one in Setup."
      : ns.state === "lapsed" ? `Lapsed on ${esc(L.longDate(L.addDays(ns.until, 1)))}. Last night flight ${esc(L.longDate(ns.last))}.`
      : `Fly at night by ${esc(L.longDate(ns.until))} (${ns.limit}-day limit).`;
    const dueTile = `<div class="tile tile-due due-${ns.state}"><span class="t-label">${ns.state === "lapsed" || ns.state === "none" ? "Night currency" : "Night currency due in"}</span><span class="t-value">${dueValue}</span><span class="t-sub">${dueSub}</span>${pill}</div>`;
    const tiles = [
      dueTile,
      tile("Since last flight", rc.last ? days(rc.sinceLast) : "–",
        rc.last ? esc(L.longDate(rc.last.date) + (rc.last.duty ? " · " + rc.last.duty : "")) : "No flights yet"),
      tile(`Since last night flight`, ns.state === "none" ? "–" : days(ns.since),
        ns.state === "none" ? "None yet. Add your last one in Setup." : esc(L.longDate(ns.last)) + (ns.source === "setup" ? " (from Setup)" : "")),
      tile("Last 30 days", `${L.fmtT(rc.t30)}<small>h</small>`, plural(rc.n30, "sortie", "sorties")),
      tile("Last 90 days", `${L.fmtT(rc.t90)}<small>h</small>`, plural(rc.n90, "sortie", "sorties")),
    ].join("");
    const coverage = rc.first
      ? `Counted from flights in the app (first: ${esc(L.longDate(rc.first.date))}).${rc.coverage < 89 ? " The 90-day figure fills in as you keep logging." : ""} Night currency limit: ${ns.limit} days.`
      : `Log your first flight to see these. Night currency limit: ${ns.limit} days.`;

    const tot = L.add(L.bfTenths(state.settings), L.sumRows(rows));
    const totals = ["c7", "c8", "c14", "c1", "c3", "c4", "c6"].map((c) =>
      `<div><dt><b>${L.COL_INFO[c].n}</b>${L.COL_INFO[c].name}</dt><dd>${L.fmtT(tot[c])}</dd></div>`).join("");

    const months = L.monthly(rows, state.statsYear);
    const flown = months.filter((m) => m.n > 0);
    const yearSum = flown.reduce((a, m) => ({ n: a.n + m.n, day: a.day + m.day, night: a.night + m.night, total: a.total + m.total }), { n: 0, day: 0, night: 0, total: 0 });
    const chips = (yrs.length ? yrs.map((y) => y.year) : [state.statsYear]).map((y) =>
      `<button type="button" class="chip" data-act="year" data-year="${y}" aria-pressed="${y === state.statsYear}">${y}</button>`).join("");
    const monthTable = flown.length ? `<table class="data" id="month-table">
        <thead><tr><th scope="col">Month</th><th scope="col">Sorties</th><th scope="col">Day</th><th scope="col">Night</th><th scope="col">Total</th></tr></thead>
        <tbody>${flown.map((m) => `<tr><td>${m.label}</td><td>${m.n}</td><td>${L.fmtT(m.day)}</td><td>${L.fmtT(m.night)}</td><td>${L.fmtT(m.total)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>${state.statsYear}</td><td>${yearSum.n}</td><td>${L.fmtT(yearSum.day)}</td><td>${L.fmtT(yearSum.night)}</td><td>${L.fmtT(yearSum.total)}</td></tr></tfoot>
      </table>` : "";
    const yearTable = yrs.length ? `<table class="data">
        <thead><tr><th scope="col">Year</th><th scope="col">Sorties</th><th scope="col">Day</th><th scope="col">Night</th><th scope="col">Total</th></tr></thead>
        <tbody>${yrs.map((y) => `<tr><td>${y.year}</td><td>${y.n}</td><td>${L.fmtT(y.day)}</td><td>${L.fmtT(y.night)}</td><td>${L.fmtT(y.total)}</td></tr>`).join("")}</tbody>
      </table>` : `<p class="empty-note">No flights logged yet.</p>`;

    return `<div class="stack">
      <div class="tiles">${tiles}</div>
      <p class="note">${coverage}</p>
      <section class="card stack"><h2>Logbook totals</h2>
        <p class="hint">Your Total brought forward plus every flight in the app.</p>
        <dl class="totals">${totals}</dl></section>
      <section class="card stack">
        <div class="card-head"><h2>Hours by month</h2><div class="chips" role="group" aria-label="Year">${chips}</div></div>
        <div class="chart" id="chart"></div>
        ${monthTable}
      </section>
      <section class="card stack"><h2>Hours by year</h2>${yearTable}
        <p class="note">Years count only flights logged in the app.</p></section>
    </div>`;
  }
  function barPath(x, y, w, h) {
    const r = Math.max(0, Math.min(4, w / 2, h));
    const f = (n) => n.toFixed(1);
    return `M${f(x)},${f(y + h)}V${f(y + r)}Q${f(x)},${f(y)} ${f(x + r)},${f(y)}H${f(x + w - r)}Q${f(x + w)},${f(y)} ${f(x + w)},${f(y + r)}V${f(y + h)}Z`;
  }
  function drawChart() {
    const host = document.getElementById("chart");
    if (!host) return;
    const year = state.statsYear;
    const months = L.monthly(state.rows, year);
    const maxT = Math.max(0, ...months.map((m) => m.total));
    if (!maxT) { host.innerHTML = `<p class="empty-note">No flights logged in ${year}.</p>`; return; }
    const W = Math.max(260, Math.floor(host.clientWidth || 320));
    const H = 196, padL = 34, padR = 4, padT = 20, padB = 24;
    const sc = L.niceScale(maxT);
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const band = plotW / 12;
    const bw = Math.min(24, Math.max(6, Math.floor(band * 0.6)));
    const y = (t) => padT + plotH - (t / sc.max) * plotH;
    const base = y(0);
    let maxI = 0;
    months.forEach((m, i) => { if (m.total > months[maxI].total) maxI = i; });
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Hours flown each month in ${year}">`;
    for (let v = 0; v <= sc.max; v += sc.step) {
      const yy = y(v).toFixed(1);
      if (v > 0) svg += `<line class="gl" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
      svg += `<text class="ax" x="${padL - 6}" y="${yy}" dy="0.32em" text-anchor="end">${L.fmtTick(v, sc.step)}</text>`;
    }
    svg += `<line class="base" x1="${padL}" x2="${W - padR}" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}"/>`;
    months.forEach((m, i) => {
      const cx = padL + band * i + band / 2;
      if (m.total > 0) svg += `<path class="bar" data-i="${i}" d="${barPath(cx - bw / 2, y(m.total), bw, base - y(m.total))}"/>`;
      svg += `<text class="ax" x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle">${band >= 30 ? m.label : m.label.charAt(0)}</text>`;
    });
    svg += `<text class="val" x="${(padL + band * maxI + band / 2).toFixed(1)}" y="${(y(months[maxI].total) - 6).toFixed(1)}" text-anchor="middle">${L.fmtT(months[maxI].total)}</text>`;
    months.forEach((m, i) => {
      svg += `<rect class="hit" data-i="${i}" x="${(padL + band * i).toFixed(1)}" y="${padT}" width="${band.toFixed(1)}" height="${plotH}" tabindex="0" role="img" aria-label="${m.label} ${year}: ${L.fmtT(m.total)} hours, ${plural(m.n, "sortie", "sorties")}"/>`;
    });
    svg += `</svg><div class="tip" hidden></div>`;
    host.innerHTML = svg;
    const tip = host.querySelector(".tip");
    const bars = host.querySelectorAll(".bar");
    const show = (i) => {
      const m = months[i];
      tip.innerHTML = `<strong>${L.fmtT(m.total)} h</strong><span>${m.label} ${year} · ${plural(m.n, "sortie", "sorties")}</span>${m.total ? `<span>Day ${L.fmtT(m.day)} · Night ${L.fmtT(m.night)}</span>` : ""}`;
      tip.hidden = false;
      const cx = padL + band * i + band / 2;
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(W - half, Math.max(half, cx)) + "px";
      tip.style.top = (m.total ? y(m.total) - (i === maxI ? 16 : 0) : base) + "px";
      bars.forEach((b) => b.classList.toggle("dim", Number(b.dataset.i) !== i));
    };
    const hide = () => { tip.hidden = true; bars.forEach((b) => b.classList.remove("dim")); };
    host.querySelectorAll(".hit").forEach((h) => {
      const i = Number(h.dataset.i);
      h.addEventListener("pointerenter", () => show(i));
      h.addEventListener("pointerleave", hide);
      h.addEventListener("focus", () => show(i));
      h.addEventListener("blur", hide);
    });
  }

  function updateSetupCheck() {
    const el = document.getElementById("s-check");
    if (!el) return;
    const val = (c) => (document.getElementById("s-" + c) || {}).value || "";
    const t = (c) => { const p = L.parseHours(val(c), 999999); return p.ok ? p.t : null; };
    const four = ["c1", "c3", "c4", "c6"].map(t);
    if (four.some((x) => x == null)) { el.textContent = ""; return; }
    const sum = four.reduce((a, b) => a + b, 0);
    if (val("c7").trim() === "") { el.textContent = `(7) will be ${L.fmtT(sum)}, the sum of (1) + (3) + (4) + (6).`; return; }
    const t7 = t("c7");
    if (t7 == null) { el.textContent = ""; return; }
    el.textContent = t7 === sum ? "(7) matches (1) + (3) + (4) + (6)."
      : `(7) is ${L.fmtT(t7)}, but (1) + (3) + (4) + (6) = ${L.fmtT(sum)}. Check the numbers. It's fine if older pages used (2) or (5).`;
  }
  function saveSetup() {
    const val = (id) => (document.getElementById(id) || {}).value || "";
    const errs = [];
    const bf = {};
    for (const c of L.COLS) {
      const raw = val("s-" + c);
      if (c === "c7" && raw.trim() === "") continue;
      const p = L.parseHours(raw, 999999);
      if (!p.ok) { errs.push(`${L.COL_INFO[c].n}: ${p.error}.`); continue; }
      bf[c] = p.t / 10;
    }
    if (bf.c7 == null) bf.c7 = (L.toT(bf.c1) + L.toT(bf.c3) + L.toT(bf.c4) + L.toT(bf.c6)) / 10;
    const asOf = val("s-asof").trim();
    if (!asOf) errs.push("Enter the date of your totals (Totals as of).");
    else if (!L.validISO(asOf)) errs.push("Check the totals date.");
    else if (asOf > todayISO()) errs.push("The totals date can't be in the future.");
    else {
      const early = state.rows.filter((r) => r.date <= asOf);
      if (early.length) errs.push(`${plural(early.length, "flight", "flights")} in the app ${early.length === 1 ? "is" : "are"} on or before ${L.longDate(asOf)} (earliest ${L.longDate(early[0].date)}), so the totals would count ${early.length === 1 ? "it" : "them"} twice. Pick a date before your first flight in the app.`);
    }
    const nlRaw = val("s-nlimit").trim();
    const nightLimit = nlRaw === "" ? 45 : Number(nlRaw);
    if (!Number.isInteger(nightLimit) || nightLimit < 1 || nightLimit > 365) errs.push("Night currency limit must be 1 to 365 days.");
    const nlast = val("s-nlast").trim();
    if (nlast && !L.validISO(nlast)) errs.push("Check the last night flight date.");
    else if (nlast && nlast > todayISO()) errs.push("The last night flight date can't be in the future.");
    const errEl = document.getElementById("s-err");
    if (errs.length) { errEl.textContent = errs.join(" "); return; }
    if (!guard()) return;
    const now = Date.now();
    // Older setups also stored a page number and lines per page; they are kept but no longer used.
    const obj = Object.assign({}, state.settings || {}, {
      kind: "settings", bf, asOf,
      nightLimit, lastNightBefore: nlast || "",
      defaultType: val("s-type").trim() || "F/A-18",
      createdAt: (state.settings && state.settings.createdAt) || now, updatedAt: now,
    });
    state.settings = obj;
    recompute();
    state.setupDirty = false;
    state.month = null;
    writeSettings(obj);
    toast("Setup saved");
    go("book");
  }

  /* ---------------- Edit flight (and "All fields"): one screen ----------------

  function sheetLists() {
    const rows = state.rows, v = sheet.v;
    const withCur = (arr, cur) => (cur && !arr.includes(cur) ? [cur].concat(arr) : arr);
    const tenths = (arr, cur) => {
      let a = arr.slice();
      if (cur > 0 && !a.includes(cur)) a = a.concat([cur]).sort((x, y) => x - y);
      return [0].concat(a);
    };
    return {
      tails: withCur(L.topValues(rows, (r) => r.tail, 8), v.tail),
      duties: withCur(L.topValues(rows, (r) => r.duty, 8), v.duty),
      names: withCur(L.topValues(rows.filter((r) => r.role === "dual"), (r) => r.captain, 6), v.captain),
      day: tenths(L.tenthChips(rows, (r) => L.toT(r.day), 7, [12, 13, 11, 14, 10, 15, 9, 16, 8]), v.dayT),
      night: tenths(L.tenthChips(rows, (r) => L.toT(r.night), 7, [13, 12, 14, 10, 15, 5, 8]), v.nightT),
    };
  }
  function dateLabelOf(iso) {
    const today = todayISO();
    if (iso === today) return `Today · ${L.shortDate(iso)}`;
    if (iso === L.addDays(today, -1)) return `Yesterday · ${L.shortDate(iso)}`;
    return L.validISO(iso) ? L.longDate(iso) : "Pick a date";
  }

            <label class="date-btn" for="f-date"><span id="f-date-txt">${esc(dateLabelOf(v.date))}</span><span aria-hidden="true">▾</span><input id="f-date" type="date" value="${esc(v.date)}"${firstAllowed() ? ` min="${firstAllowed()}"` : ""} max="${todayISO()}" aria-labelledby="lbl-date"></label>
          </div>
          ${listRow("tail", "Aircraft No.", lists.tails, v.tail, "e.g. 431", 'inputmode="numeric"')}
          ${listRow("duty", "Duty", lists.duties, v.duty, "Mission, e.g. BFM", 'autocapitalize="characters"')}

          </div>

          </div>

  }
  function readSheet() {
    if (!sheet || !document.getElementById("flight-form")) return;
    const g = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
    const v = sheet.v, o = sheet.other;
    const d = g("f-date");
    if (L.validISO(d)) v.date = d;
    if (o.tail) v.tail = g("f-tail").trim();
    if (o.duty) v.duty = g("f-duty").trim();
    if (o.name) v.captain = g("f-name").trim();
    for (const f of ["day", "night"]) {
      if (!o[f]) continue;
      const raw = g("f-" + f);
      const p = L.parseHours(raw, 240);
      v[f + "T"] = raw.trim() === "" ? null : p.ok ? p.t : NaN;
      v[f + "Err"] = p.ok ? "" : p.error;
    }
    const ty = document.getElementById("f-type");
    if (ty) v.type = ty.value;
    const c = document.getElementById("f-copied");
    if (c) v.copied = !!c.checked;
  }
  function hoursOf(v) {
    if (v.dayT == null) return { ok: false, err: "Pick the day hours (0.0 if none)." };
    if (Number.isNaN(v.dayT)) return { ok: false, err: `Day hours: ${v.dayErr || "use a number like 1.3"}.` };
    if (v.nightT == null) return { ok: false, err: "Pick the night hours (0.0 if none)." };
    if (Number.isNaN(v.nightT)) return { ok: false, err: `Night hours: ${v.nightErr || "use a number like 0.4"}.` };
    if (v.dayT + v.nightT === 0) return { ok: false, err: "Day and night can't both be 0.0." };
    if (v.dayT + v.nightT > 240) return { ok: false, err: "Day + night is more than 24.0 hours." };
    return { ok: true, dayT: v.dayT, nightT: v.nightT };
  }
  function updateLive() {
    if (!sheet) return;
    readSheet();
    const v = sheet.v;

    const dt = document.getElementById("f-date-txt");
    if (dt) dt.textContent = dateLabelOf(v.date);
    const sum = document.getElementById("f-sum");
    if (sum) {
      const hrs = (t) => (t == null || Number.isNaN(t) ? "?" : L.fmtT(t));
      sum.textContent = [L.validISO(v.date) ? L.shortDate(v.date) : "date?", v.tail || "No. –", v.duty || "Duty –",
        `day ${hrs(v.dayT)}`, `night ${hrs(v.nightT)}`, v.role === "dual" ? `Dual${v.captain ? " · " + v.captain : ""}` : "Solo"].join(" · ");
    }
    const cols = document.getElementById("f-cols");
    if (cols) {
      if (h.ok) {
        const c = L.rowCols({ day: h.dayT / 10, night: h.nightT / 10, role: v.role, type: v.type });
        cols.textContent = "Goes in " + L.COLS.filter((k) => c[k]).map((k) => `${L.COL_INFO[k].n} ${L.fmtT(c[k])}`).join(" · ");
      } else cols.textContent = "";

    const save = document.getElementById("f-save");
    if (save) save.textContent = sheet.dupOk ? "Save anyway" : "Save flight";
  }
  function clearSheetError() {

  }
  function pickChip(btn) {
    if (!sheet) return;

    if (f === "tail") sheet.v.tail = val;
    else if (f === "duty") sheet.v.duty = val;
    else if (f === "name") sheet.v.captain = val;
    else if (f === "day") sheet.v.dayT = Number(val);
    else if (f === "night") sheet.v.nightT = Number(val);

    row.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c === btn ? "true" : "false"));
    const box = row.querySelector(".q-other");

    clearSheetError();
    updateLive();
  }
  function openOther(f) {
    if (!sheet) return;
    readSheet();

    const row = box.closest(".q-row");

  function setToggle(kind, value) {

  function toggleMore() {

  }
  function submitSheet() {
    readSheet();
    const v = sheet.v;
    const errs = [];
    if (!L.validISO(v.date)) errs.push("Pick the date.");
    else if (v.date > todayISO()) errs.push("The date can't be in the future.");
    else if (coveredByTotals(v.date)) errs.push(coveredMsg());
    const h = hoursOf(v);
    if (!h.ok) errs.push(h.err);
    if (!String(v.type || "").trim()) errs.push("Enter the Type & Mark under More options.");
    if (v.role === "dual" && !String(v.captain || "").trim()) errs.push("Pick or type the Captain's name.");
    const errEl = document.getElementById("f-err");
    if (errs.length) { errEl.className = "err"; errEl.textContent = errs.join(" "); return; }
    if (sheet.mode === "add" && !sheet.dupOk) {
      const dup = L.findDuplicate(state.rows, { date: v.date, tail: v.tail, day: h.dayT / 10, night: h.nightT / 10 }, null);
      if (dup) {

        errEl.className = "warn";
        errEl.textContent = `Already logged: ${L.shortDate(dup.date)} · ${dup.tail || "No. –"} · ${L.fmtT(L.toT(dup.day) + L.toT(dup.night))} h. If this is a second sortie, tap Save anyway.`;

  }
  function saveFlight(v, dayT, nightT) {
    const existing = sheet.id ? state.rows.find((r) => r.id === sheet.id) : null;
    persistFlight(existing, v, dayT, nightT);
    sheet = null;
    renderSheet();
    state.month = L.monthKey(v.date);
    render();
    toast(`Saved · ${L.shortDate(v.date)}`);
  }
  // Writes one flight (new or edited).
  function persistFlight(existing, v, dayT, nightT) {
    const fid = existing ? existing.id : "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const docId = "y" + v.date.slice(0, 4);
    const pos = !existing || existing.date !== v.date || !Number.isFinite(existing.pos) ? L.nextPos(state.rows, fid) : existing.pos;
    const now = Date.now();
    const role = v.role === "dual" ? "dual" : "solo";
    const flight = {
      date: v.date, type: String(v.type).trim(), tail: String(v.tail || "").trim(), role,
      captain: role === "dual" ? String(v.captain).trim() : "SELF",
      crew: role === "dual" ? "SELF" : "",
      duty: String(v.duty || "").trim(), day: dayT / 10, night: nightT / 10, copied: !!v.copied, pos,
      createdAt: existing ? Number(existing.createdAt) || now : now, updatedAt: now + 1, deleted: false,
    };
    const moves = existing && existing._doc && existing._doc !== docId;
    if (moves) applyLocal(existing._doc, { [fid]: { deleted: true, updatedAt: now } });
    applyLocal(docId, { [fid]: flight });
    if (moves) writeYear(existing._doc, { [fid]: { deleted: true, updatedAt: now } });
    writeYear(docId, { [fid]: flight });
    return { fid };
  }
  function undoAdd(fid) {
    const r = state.rows.find((x) => x.id === fid);
    if (!r) return;
    const patch = { [fid]: { deleted: true, updatedAt: Date.now() } };
    applyLocal(r._doc, patch);
    render();
    writeYear(r._doc, patch);
    toast("Flight removed");
  }

  /* ---------------- Add flight: step by step, typed ----------------
     Jet → Duty → Hours (+ night part if Split, + Captain if Dual). The keyboard opens on each step;
     usual answers sit above it as one-tap shortcuts and filter as you type. */
  const WIZ_FIELD = { tail: "tail", duty: "duty", day: "dayStr", night: "nightStr", captain: "captain" };
  function wizSteps(v) {
    const s = ["tail", "duty", "day", "night"];
    if (v.role === "dual") s.push("captain");
    return s;
  }
  function openWizard() {
    if (state.conn !== "ready") return;
    if (!state.settings) { go("setup"); toast("Do the setup first."); return; }
    if (!guard()) return;
    lastFocus = document.activeElement;
    const rows = state.rows;
    const withZero = (arr) => ["0.0"].concat(arr.map((t) => L.fmtT(t)));
    wiz = {
      step: "tail", dupOk: false, dateOpen: false,
      v: { date: todayISO(), tail: "", duty: "", dayStr: "", nightStr: "", role: "solo", captain: "" },
      lists: {
        tail: L.topValues(rows, (r) => r.tail, 8),
        duty: L.topValues(rows, (r) => r.duty, 8),
        captain: L.topValues(rows.filter((r) => r.role === "dual"), (r) => r.captain, 6),
        day: withZero(L.tenthChips(rows, (r) => L.toT(r.day), 7, [12, 13, 11, 14, 10, 15, 9, 16, 8])),
        night: withZero(L.tenthChips(rows, (r) => L.toT(r.night), 7, [13, 12, 14, 10, 15, 5, 8])),
      },
    };
    renderWiz();
  }
  function readWizInput() {
    if (!wiz) return;
    const el = document.getElementById("w-in");
    if (el) wiz.v[WIZ_FIELD[wiz.step]] = el.value;
  }
  // Day and night are answered separately. 0.0 is a valid answer for either, but not for both.
  function wizHours(v, needNight) {
    const blank = (s) => String(s == null ? "" : s).trim() === "";
    if (blank(v.dayStr)) return { ok: false, err: "Type the day hours, or tap 0.0 if there were none." };
    const d = L.parseHours(v.dayStr, 240);
    if (!d.ok) return { ok: false, err: `Day hours: ${d.error}.` };
    if (!needNight) return { ok: true, dayT: d.t, partial: true };
    if (blank(v.nightStr)) return { ok: false, err: "Type the night hours, or tap 0.0 if there were none." };
    const n = L.parseHours(v.nightStr, 240);
    if (!n.ok) return { ok: false, err: `Night hours: ${n.error}.` };
    if (d.t + n.t === 0) return { ok: false, err: "Day and night can't both be 0.0." };
    if (d.t + n.t > 240) return { ok: false, err: "Day + night is more than 24.0 hours." };
    return { ok: true, dayT: d.t, nightT: n.t };
  }
  function renderWiz() {
    const root = document.getElementById("wiz-root");
    if (!wiz) { root.innerHTML = ""; lockScroll(); return; }
    const w = wiz, v = w.v;
    const steps = wizSteps(v);
    const k = Math.max(0, steps.indexOf(w.step));
    const isLast = k === steps.length - 1;
    const today = todayISO(), yday = L.addDays(today, -1);
    const dateLabel = v.date === today ? `Today · ${L.shortDate(v.date)}` : v.date === yday ? `Yesterday · ${L.shortDate(v.date)}` : L.longDate(v.date);
    const sofar = [L.shortDate(v.date), v.tail, v.duty, v.dayStr !== "" ? `day ${v.dayStr}` : "", v.nightStr !== "" ? `night ${v.nightStr}` : ""]
      .slice(0, 1 + k).filter(Boolean);
    const q = { tail: "Which jet?", duty: "Duty?", day: "Day hours?", night: "Night hours?", captain: "Captain? (the other pilot)" }[w.step];
    const attrs = {
      tail: 'inputmode="numeric" placeholder="e.g. 431"',
      duty: 'inputmode="text" autocapitalize="characters" placeholder="e.g. BFM"',
      day: 'inputmode="decimal" placeholder="e.g. 1.3"',
      night: 'inputmode="decimal" placeholder="0.0 if none"',
      captain: 'inputmode="text" autocapitalize="words" placeholder="Name"',
    }[w.step];
    const seg = (act, opts, cur, label) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([val, txt]) =>
      `<button type="button" class="keep" data-act="${act}" data-value="${val}" aria-pressed="${cur === val}">${txt}</button>`).join("")}</div>`;
    root.innerHTML = `
      <div class="wiz" role="dialog" aria-modal="true" aria-labelledby="w-q">
        <div class="wrap wiz-head">
          <button class="btn ghost keep" type="button" data-act="w-back">${k === 0 ? "Cancel" : "‹ Back"}</button>
          <span class="wiz-step">Add flight · ${k + 1} of ${steps.length}</span>
          <button class="btn ghost keep" type="button" data-act="w-all">All fields</button>
        </div>
        <div class="wrap wiz-progress" aria-hidden="true">${steps.map((s, i) => `<span class="${i <= k ? "on" : ""}"></span>`).join("")}</div>
        <div class="wrap wiz-body">
          <div class="wiz-ctx">
            <label class="wiz-date" for="w-date-in"><span>${esc(dateLabel)} ▾</span><input id="w-date-in" type="date" value="${esc(v.date)}"${firstAllowed() ? ` min="${firstAllowed()}"` : ""} max="${today}" aria-label="Flight date"></label>
          </div>
          ${k > 0 ? `<p class="wiz-sofar">${esc(sofar.join(" · "))}</p>` : ""}
          <label class="wiz-q" for="w-in" id="w-q">${q}</label>
          ${w.step === "day" || w.step === "night" ? `<div class="q-two">${seg("w-role", [["solo", "Solo"], ["dual", "Dual"]], v.role, "Who was aboard")}</div>` : ""}
          <div class="wiz-row">
            <input id="w-in" ${attrs} enterkeyhint="${isLast ? "done" : "next"}" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(v[WIZ_FIELD[w.step]])}">
            <button class="btn primary keep" type="button" data-act="w-next" id="w-next">${isLast ? (w.dupOk ? "Save anyway" : "Save") : "Next"}</button>
          </div>
          <p class="err" id="w-err" role="alert"></p>
          <div class="chips" id="w-chips"></div>
          ${w.step === "day" || w.step === "night" ? `<p class="q-cols" id="w-cols"></p>` : ""}
        </div>
      </div>`;
    lockScroll();
    updateWizLive();
    const inp = document.getElementById("w-in");
    if (inp) {
      focusEl(inp);
      try { const n = inp.value.length; inp.setSelectionRange(n, n); } catch (e) { /* not supported */ }

  function updateWizLive() {
    if (!wiz) return;

    const w = wiz, v = w.v;
    const chipsEl = document.getElementById("w-chips");
    if (chipsEl) {
      const raw = String(v[WIZ_FIELD[w.step]] || "").trim();
      const numeric = w.step === "day" || w.step === "night";
      const typedT = numeric ? L.parseHours(raw, 240) : null;
      const isOn = (x) => (numeric ? raw !== "" && typedT.ok && L.toT(x) === typedT.t : x.toUpperCase() === raw.toUpperCase());
      const list = L.filterChips(w.lists[w.step] || [], raw).slice(0, 10);
      chipsEl.innerHTML = list.map((x) => `<button type="button" class="chip keep" data-act="w-pick" data-value="${esc(x)}" aria-pressed="${isOn(x) ? "true" : "false"}">${esc(x)}</button>`).join("");
      chipsEl.hidden = !list.length;
    }
    const cols = document.getElementById("w-cols");
    if (cols) {
      const h = wizHours(v, w.step === "night");
      if (h.ok && !h.partial) {
        const c = L.rowCols({ day: h.dayT / 10, night: h.nightT / 10, role: v.role, type: state.settings.defaultType || "F/A-18" });
        cols.textContent = "Goes in " + L.COLS.filter((x) => c[x]).map((x) => `${L.COL_INFO[x].n} ${L.fmtT(c[x])}`).join(" · ");
      } else cols.textContent = h.ok && h.partial ? "Next: night hours." : "";

  function wizError(msg, warn) {
    const e = document.getElementById("w-err");
    if (e) { e.className = warn ? "warn" : "err"; e.textContent = msg; }
    focusEl(document.getElementById("w-in"));
  }
  function wizNext() {
    if (!wiz) return;
    readWizInput();
    const w = wiz, v = w.v, steps = wizSteps(v), k = steps.indexOf(w.step);
    if (w.step === "tail") {
      if (!v.tail.trim()) return wizError("Type the jet number, or tap one below.");
      v.tail = L.matchKnown(v.tail, w.lists.tail);
    } else if (w.step === "duty") {
      if (!v.duty.trim()) return wizError("Type the duty, or tap one below.");
      v.duty = L.matchKnown(v.duty, w.lists.duty);
    } else if (w.step === "day") {
      const h = wizHours(v, false);
      if (!h.ok) return wizError(h.err);
      v.dayStr = L.fmtT(h.dayT);
    } else if (w.step === "night") {
      const h = wizHours(v, true);
      if (!h.ok) return wizError(h.err);
      v.nightStr = L.fmtT(h.nightT);
    } else if (w.step === "captain") {
      if (!v.captain.trim()) return wizError("Type the Captain's name, or tap one below.");
      v.captain = L.matchKnown(v.captain, w.lists.captain);
    }

    wizFinish();
  }
  function wizFinish() {
    const w = wiz, v = w.v;
    const h = wizHours(v, true);
    if (!h.ok) return wizError(h.err);
    if (!L.validISO(v.date)) return wizError("Pick the date.");
    if (coveredByTotals(v.date)) return wizError(coveredMsg());
    const rec = {
      date: v.date, type: state.settings.defaultType || "F/A-18", tail: v.tail.trim(), duty: v.duty.trim(),
      role: v.role === "dual" ? "dual" : "solo", captain: v.captain.trim(), copied: false,
    };
    if (!w.dupOk) {
      const dup = L.findDuplicate(state.rows, { date: rec.date, tail: rec.tail, day: h.dayT / 10, night: h.nightT / 10 }, null);
      if (dup) {
        w.dupOk = true;
        const btn = document.getElementById("w-next");
        if (btn) btn.textContent = "Save anyway";
        return wizError(`Already logged: ${L.shortDate(dup.date)} · ${dup.tail || "No. –"} · ${L.fmtT(L.toT(dup.day) + L.toT(dup.night))} h. If this is a second sortie, tap Save anyway.`, true);
      }
    }
    if (!guard()) return;
    const { fid } = persistFlight(null, rec, h.dayT, h.nightT);
    closeWiz(false);

    toast(`Saved · ${L.shortDate(rec.date)}`, { label: "Undo", fn: () => undoAdd(fid) });
  }
  function wizBack() {
    if (!wiz) return;
    readWizInput();
    const steps = wizSteps(wiz.v), k = steps.indexOf(wiz.step);
    if (k <= 0) { closeWiz(); return; }
    wiz.step = steps[k - 1];
    wiz.dupOk = false;
    renderWiz();
  }
  function wizAllFields() {
    if (!wiz) return;
    readWizInput();
    const v = wiz.v;
    const d = L.parseHours(v.dayStr, 240), n = L.parseHours(v.nightStr, 240);
    const blank = (s) => String(s == null ? "" : s).trim() === "";
    const prefill = {
      date: v.date, tail: v.tail.trim(), duty: v.duty.trim(),
      dayT: blank(v.dayStr) || !d.ok ? null : d.t, nightT: blank(v.nightStr) || !n.ok ? null : n.t,
      role: v.role, captain: v.captain.trim(),
