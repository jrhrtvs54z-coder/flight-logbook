<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4eceb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<script>try{var l=localStorage.getItem("logbook.look");if(l&&l!=="ledger"&&/^[a-z]+$/.test(l))document.documentElement.setAttribute("data-look",l)}catch(e){}</script>
<title>Flight Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&amp;family=B612+Mono:wght@400;700&amp;display=swap">
<style>
:root {
  /* Layout: sticky header with tabs. Book = ruled ledger sheets ("Flying" | "Details") for one month at a time,
     one side at a time on a phone (swipe), side by side as an open book on wide screens. Lines still to write are in pen blue. Add flight = one-tap chips.
     Copy mode = one line at a time, full screen. Stats = recency tiles, monthly columns, tables. Setup = one form.
     Type: B612 (cockpit display face) + B612 Mono for figures. */
  --paper: #e4eceb;
  --sheet: #f8fbfa;
  --ink: #0f1c1b;
  --ink-2: #4b5e5c;
  --rule: #b4c8c5;
  --pen: #1a3cb5;

  --rule-strong: #8aa29f;
  --pen-wash: rgba(26, 60, 181, 0.07);
  --next-bg: #e9eef8;
  --tot-bg: #eef3f2;
  --done-bg: #13782f;
  --done-ink: #ffffff;
  --bad: #c43535;
  --red-text: #c0262d;
  --bar: #2a78d6;
  --grid: #dbe4e2;
  --scrim: rgba(10, 20, 19, 0.38);
  --shadow: 0 1px 2px rgba(15, 28, 27, 0.06), 0 8px 28px rgba(15, 28, 27, 0.07);
  --status-warn: #fab219;
  --status-crit: #d03b3b;

  --font-ui: "B612", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-head: var(--font-ui);
  --r-sheet: 4px;
  --r-card: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1312;
    --sheet: #131e1d;
    --ink: #e1eae8;
    --ink-2: #9cb0ad;
    --rule: #2a3b39;
    --pen: #93a9ff;
    --rule-strong: #405653;
    --pen-wash: rgba(147, 169, 255, 0.09);
    --next-bg: #1f2b31;
    --tot-bg: #182423;
    --done-bg: #2fae4d;
    --done-ink: #06140a;
    --bad: #ff7a7a; --red-text: #ff7b72;
    --bar: #3987e5;
    --grid: #22312f;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1312;
  --sheet: #131e1d;
  --ink: #e1eae8;
  --ink-2: #9cb0ad;
  --rule: #2a3b39;
  --pen: #93a9ff;
  --rule-strong: #405653;
  --pen-wash: rgba(147, 169, 255, 0.09);
  --next-bg: #1f2b31;
  --tot-bg: #182423;
  --done-bg: #2fae4d;
  --done-ink: #06140a;
  --bad: #ff7a7a; --red-text: #ff7b72;
  --bar: #3987e5;
  --grid: #22312f;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

/* ---------- Themes (Setup > Theme). Each sets every color token, so the phone's dark mode can't leak in. ---------- */
:root[data-look="paper"] {
  --paper: #ece2cb; --sheet: #fbf6ea; --ink: #2a2118; --ink-2: #6b5c48; --rule: #dccbab; --rule-strong: #b8a07a;
  --pen: #1f3f8f; --pen-wash: rgba(31, 63, 143, 0.07); --next-bg: #f1e7d0; --tot-bg: #f4ecda;
  --done-bg: #2f6b3a; --done-ink: #fffdf6; --bad: #a8322b; --red-text: #b3261e; --bar: #1f3f8f; --grid: #e6d9bd;
  --scrim: rgba(42, 33, 24, 0.42); --shadow: 0 1px 2px rgba(60, 40, 20, 0.08), 0 8px 24px rgba(60, 40, 20, 0.08);
  --status-warn: #e0a019; --status-crit: #b8322b;
  --font-ui: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-head: "Source Serif 4", Georgia, serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-sheet: 2px; --r-card: 6px;
  color-scheme: light;
}
:root[data-look="cockpit"] {
  --paper: #040706; --sheet: #09100c; --ink: #b9f6c8; --ink-2: #66a575; --rule: #1a3022; --rule-strong: #2e5838;
  --pen: #3fe6ff; --pen-wash: rgba(63, 230, 255, 0.08); --next-bg: #0d1c20; --tot-bg: #0c1810;
  --done-bg: #36d46c; --done-ink: #021006; --bad: #ff5a4f; --red-text: #ff6b5e; --bar: #3fe6ff; --grid: #14251a;
  --scrim: rgba(0, 0, 0, 0.62); --shadow: none;
  --status-warn: #ffb000; --status-crit: #ff3b30;
  --font-ui: "B612", system-ui, sans-serif;
  --font-head: "B612 Mono", ui-monospace, monospace;
  --font-num: "B612 Mono", ui-monospace, monospace;
  --r-sheet: 2px; --r-card: 4px;
  color-scheme: dark;
}
:root[data-look="night"] {
  --paper: #000000; --sheet: #0a0101; --ink: #e04848; --ink-2: #a03434; --rule: #2a0808; --rule-strong: #4d1313;
  --pen: #ff6a5c; --pen-wash: rgba(255, 106, 92, 0.08); --next-bg: #1c0404; --tot-bg: #130202;
  --done-bg: #b8312a; --done-ink: #000000; --bad: #ff8a7a; --red-text: #ff9a8a; --bar: #c23a32; --grid: #210606;
  --scrim: rgba(0, 0, 0, 0.72); --shadow: none;
  --status-warn: #d9622b; --status-crit: #ff3b30;
  --font-ui: "B612", system-ui, sans-serif;
  --font-head: "B612", system-ui, sans-serif;
  --font-num: "B612 Mono", ui-monospace, monospace;
  --r-sheet: 4px; --r-card: 8px;
  color-scheme: dark;
}
:root[data-look="desert"] {
  --paper: #e6dbc2; --sheet: #f6f0e2; --ink: #2a2a1e; --ink-2: #67624b; --rule: #d3c7a8; --rule-strong: #a99b75;
  --pen: #8c4a12; --pen-wash: rgba(140, 74, 18, 0.08); --next-bg: #efe3c8; --tot-bg: #eee5cf;
  --done-bg: #4b5d23; --done-ink: #f6f0e2; --bad: #a3281e; --red-text: #a3281e; --bar: #6f7f3a; --grid: #dfd4b8;
  --scrim: rgba(42, 42, 30, 0.42); --shadow: 0 1px 2px rgba(60, 50, 20, 0.08), 0 6px 18px rgba(60, 50, 20, 0.07);
  --status-warn: #e0a019; --status-crit: #a3281e;
  --font-ui: "Barlow", system-ui, sans-serif;
  --font-head: "Stardos Stencil", "Barlow", sans-serif;
  --font-num: "Share Tech Mono", ui-monospace, monospace;
  --r-sheet: 2px; --r-card: 4px;
  color-scheme: light;
}
:root[data-look="clean"] {
  --paper: #f2f2f7; --sheet: #ffffff; --ink: #1c1c1e; --ink-2: #6c6c70; --rule: #e3e3e8; --rule-strong: #c7c7cc;
  --pen: #007aff; --pen-wash: rgba(0, 122, 255, 0.08); --next-bg: #eaf2ff; --tot-bg: #f6f6f9;
  --done-bg: #34c759; --done-ink: #ffffff; --bad: #ff3b30; --red-text: #d70015; --bar: #007aff; --grid: #ececf1;
  --scrim: rgba(0, 0, 0, 0.32); --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
  --status-warn: #ffcc00; --status-crit: #ff3b30;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sheet: 12px; --r-card: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-look="clean"] {
    --paper: #000000; --sheet: #1c1c1e; --ink: #f2f2f7; --ink-2: #98989f; --rule: #2c2c2e; --rule-strong: #3a3a3c;
    --pen: #0a84ff; --pen-wash: rgba(10, 132, 255, 0.12); --next-bg: #0f2238; --tot-bg: #232326;
    --done-bg: #30d158; --done-ink: #00210b; --bad: #ff453a; --red-text: #ff6961; --bar: #0a84ff; --grid: #2c2c2e;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: none;
    --status-warn: #ffd60a; --status-crit: #ff453a;
    color-scheme: dark;
  }
}
:root[data-look="sunlight"] {
  --paper: #ffffff; --sheet: #ffffff; --ink: #000000; --ink-2: #262626; --rule: #8c8c8c; --rule-strong: #000000;
  --pen: #0033cc; --pen-wash: rgba(0, 51, 204, 0.08); --next-bg: #e3e9ff; --tot-bg: #efefef;
  --done-bg: #00701f; --done-ink: #ffffff; --bad: #c00000; --red-text: #c00000; --bar: #0033cc; --grid: #c8c8c8;
  --scrim: rgba(0, 0, 0, 0.5); --shadow: none;
  --status-warn: #f2a900; --status-crit: #c00000;
  --font-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-head: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
  --r-sheet: 4px; --r-card: 8px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }
.wide .wrap { max-width: 1180px; }

/* Header */
.top { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 2px; }
.brand { display: grid; gap: 1px; min-width: 0; }
.brand h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.brand .sub { font-size: 12px; color: var(--ink-2); font-family: var(--font-num); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rule-strong); }
.sync[data-s="ok"]::before { background: var(--done-bg); }
.sync[data-s="saving"]::before { background: var(--pen); }
.sync[data-s="bad"]::before { background: var(--bad); }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 10px 12px; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: 0.03em; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
main { padding-top: 16px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 8px; padding-bottom: 10px; border-top: 1px solid var(--rule); }
.tools .side-toggle { margin-top: 0; }
.tools .seg button { padding: 7px 12px; }
.add-btn { margin-left: auto; border: 0; border-radius: 999px; background: var(--pen); color: var(--sheet); font-size: 14px; font-weight: 700; padding: 9px 15px; white-space: nowrap; }

/* Book */
.book-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.pager { display: flex; align-items: center; gap: 10px; }
.navbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 20px; line-height: 1; display: grid; place-items: center; padding: 0; color: var(--ink); }
.navbtn:disabled { opacity: 0.35; cursor: default; }
.pg { display: grid; justify-items: center; min-width: 70px; }
.pg-label { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); }
.pg-num { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; }
.pg-meta { font-size: 12.5px; color: var(--ink-2); flex: 1 1 150px; }
.pg-btn { border: 0; background: none; color: inherit; font: inherit; padding: 2px 10px 3px; border-radius: 10px; cursor: pointer; }
.pg-btn .pg-label::after { content: " \25BE"; letter-spacing: 0; }
.pg-btn:active { background: var(--rule); }
.sheet-card.dragging { will-change: transform; }
.swipe-hint { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .sheet-card.enter-r { animation: enter-r 200ms ease-out; }
  .sheet-card.enter-l { animation: enter-l 200ms ease-out; }
  @keyframes enter-r { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes enter-l { from { transform: translateX(-100%); } to { transform: none; } }
}
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--sheet); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); font-weight: 700; }
.side-toggle { margin-top: 12px; }
.copy-cta { margin-top: 12px; width: 100%; padding: 13px 16px; font-size: 15px; }
.book { display: grid; gap: 16px; margin-top: 12px; }
.sheet-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sheet); box-shadow: var(--shadow); min-width: 0; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 12px 9px; border-bottom: 2px solid var(--ink); }
.sheet-title { font-size: 15px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
.sheet-sub { font-size: 11px; color: var(--ink-2); text-align: right; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ledger { width: 100%; border-collapse: collapse; font-family: var(--font-num); font-size: 12px; font-variant-numeric: tabular-nums; }
.ledger th { font-family: var(--font-ui); font-weight: 400; font-size: 10px; line-height: 1.2; color: var(--ink-2); text-align: center; vertical-align: bottom; padding: 5px 3px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule-strong); }
.ledger thead tr:first-child th { height: 28px; vertical-align: middle; }
.ledger thead tr:last-child th { height: 48px; }
.ledger th b { display: block; margin-top: 2px; font-family: var(--font-num); font-weight: 700; font-size: 11px; color: var(--ink); }
.ledger td, .ledger tbody th { height: 36px; padding: 0 4px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); white-space: nowrap; }
.ledger tr > :last-child { border-right: 0; }
.ledger .num { text-align: right; }
.ledger .txt { white-space: normal; line-height: 1.2; }
.ledger .c-line { width: 38px; min-width: 38px; text-align: center; padding: 0 3px; position: sticky; left: 0; z-index: 1; background: var(--sheet); }
.ledger .c-mon { min-width: 42px; }
.ledger .c-date { min-width: 30px; }
.ledger .c-type { min-width: 58px; }
.ledger .c-no { min-width: 48px; }
.ledger .c-cap { min-width: 84px; }
.ledger .c-crew { min-width: 64px; }
.ledger .c-duty { min-width: 96px; }
.ledger .c-val { min-width: 42px; }
.ledger tr.line { cursor: pointer; }
.ledger tr.line.todo .v { color: var(--pen); }
.ledger tr.line.next > * { background: var(--next-bg); }
.ledger tr.line.next > .c-line { box-shadow: inset 3px 0 0 var(--pen); }
.ledger tr.line:focus-visible { outline-offset: -2px; }
.ledger .ln { font-size: 10.5px; color: var(--rule-strong); }
.ledger tr.add .ln { color: var(--pen); font-weight: 700; }
.ledger .add-cell { color: var(--pen); font-family: var(--font-ui); font-size: 12px; }
.ledger tr.tot > * { background: var(--tot-bg); font-weight: 700; }
.ledger tr.tot .lbl { font-family: var(--font-ui); font-weight: 400; font-size: 11px; color: var(--ink-2); }
.ledger tr.tot .lblc { font-family: var(--font-ui); font-size: 9px; letter-spacing: 0.04em; color: var(--ink-2); }
/* The month's totals in red, like totals written in red ink. B/F and C/F stay in normal ink. */
.ledger tr.tot.sum > *, .ledger tr.tot.sum .lbl, .ledger tr.tot.sum .lblc { color: var(--red-text); }
.ledger tr.tot.sum .lbl { font-weight: 700; }
.ledger tr.bf > * { border-bottom: 2px solid var(--rule-strong); }
.ledger tr.cf > * { border-top: 2px solid var(--ink); }
.ledger .dash { text-align: center; color: var(--ink-2); font-weight: 400; }
.yr-tag { display: block; font-size: 9px; line-height: 1; color: var(--ink-2); }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--pen); background: var(--sheet); color: var(--pen); font-family: var(--font-num); font-size: 11px; font-weight: 700; padding: 0; display: inline-grid; place-items: center; vertical-align: middle; }
.tick[aria-pressed="true"] { background: var(--done-bg); border-color: var(--done-bg); color: var(--done-ink); }
@media (prefers-reduced-motion: no-preference) {
  .tick.pop { animation: stamp 260ms ease-out; }
  @keyframes stamp { 0% { transform: scale(0.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
.legend .l-done { background: var(--done-bg); }
.legend .l-todo { border: 1.5px solid var(--pen); }
.book-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.add-inline { display: none; margin-left: auto; }
@media (max-width: 480px) {
  .wrap { padding: 0 12px; }
  .ledger.fly { font-size: 11.5px; }
  .ledger .c-line { width: 34px; min-width: 34px; padding: 0 2px; }
  .ledger .c-mon { min-width: 34px; }
  .ledger .c-date { min-width: 24px; }
  .ledger .c-type { min-width: 48px; }
  .ledger .c-no { min-width: 34px; }
  .ledger .c-cap { min-width: 62px; }
  .ledger .c-crew { min-width: 46px; }
  .ledger .c-duty { min-width: 70px; }
  .ledger .c-val { min-width: 38px; }
  .tick { width: 26px; height: 26px; }
}
@media (max-width: 999.98px) {
  .book[data-side="flying"] .sheet-card.details, .book[data-side="details"] .sheet-card.flying { display: none; }
  main[data-view="book"] { overflow-x: hidden; overflow-x: clip; }
  .swipe-hint { display: inline; }
}
@media (min-width: 720px) { .copy-cta { width: auto; } }
@media (min-width: 1000px) {
  .side-toggle { display: none; }
  .wide .fab { display: none; }
  .wide .add-inline { display: inline-block; }
  .book { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0; }
  .sheet-card.flying { border-radius: var(--r-sheet) 0 0 var(--r-sheet); position: relative; }
  .sheet-card.flying::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 16px; background: linear-gradient(to left, rgba(0, 0, 0, 0.1), transparent); pointer-events: none; }
  .sheet-card.details { border-radius: 0 var(--r-sheet) var(--r-sheet) 0; border-left-color: var(--rule-strong); }
}

/* Cards, stats */
.stack { display: grid; gap: 14px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 16px; }
.card h2 { font-size: 12.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.hint { font-size: 13px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 12px; display: grid; gap: 3px; align-content: start; }
.tile-due { grid-column: 1 / -1; }
.tile-due.due-warn { border-left: 3px solid var(--status-warn); }

.t-label { font-size: 12px; color: var(--ink-2); }

.pill { display: inline-flex; align-items: center; gap: 5px; justify-self: start; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; margin-top: 4px; }

.pill-warn { background: var(--status-warn); color: #0b0b0b; }

.totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0 20px; margin: 0; }
.totals div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.totals dt { font-size: 12.5px; color: var(--ink-2); }
.totals dt b { color: var(--ink); font-family: var(--font-num); margin-right: 6px; }
.totals dd { margin: 0; font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule-strong); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--rule-strong); stroke-width: 1; }
.chart .ax { fill: var(--ink-2); font-family: var(--font-num); font-size: 10px; }

.chart .bar { fill: var(--bar); transition: opacity 120ms; }
.chart .bar.dim { opacity: 0.4; }
.chart .hit { fill: transparent; outline: none; cursor: default; }
.chart .hit:focus-visible { stroke: var(--pen); stroke-width: 2; }
.tip { position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, calc(-100% - 8px)); background: var(--ink); color: var(--sheet); border-radius: 6px; padding: 7px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap; display: grid; }
.tip strong { font-family: var(--font-num); font-size: 14px; }
.data { width: 100%; border-collapse: collapse; font-size: 13px; }
.data th { font-weight: 400; font-size: 11.5px; color: var(--ink-2); text-align: right; padding: 6px; border-bottom: 1px solid var(--rule-strong); }

.data th:first-child, .data td:first-child { text-align: left; }
.data tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
.note { font-size: 12.5px; color: var(--ink-2); }
.empty-note { font-size: 13px; color: var(--ink-2); padding: 18px 0; }

/* Forms */
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.bf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
@media (min-width: 620px) { .bf-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.field { display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-2); align-content: start; }

.look { display: grid; gap: 5px; align-content: start; text-align: left; padding: 10px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--paper); color: var(--ink); }
.look[aria-pressed="true"] { border-color: var(--pen); box-shadow: inset 0 0 0 1px var(--pen); }

.check { font-size: 12.5px; color: var(--ink-2); }
.err { font-size: 13px; color: var(--bad); }
.err:empty, .check:empty, .warn:empty { display: none; }
.warn { font-size: 12.5px; color: var(--ink); background: var(--pen-wash); border-left: 3px solid var(--pen); padding: 8px 10px; border-radius: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 700; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.fab { position: fixed; right: 16px; bottom: 18px; z-index: 25; border: 0; border-radius: 999px; background: var(--pen); color: var(--sheet); font-weight: 700; font-size: 15px; padding: 14px 20px; box-shadow: 0 6px 20px rgba(26, 60, 181, 0.28); }
.banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--rule); border-left: 3px solid var(--bad); background: var(--sheet); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
.banner.warn-b { border-left-color: var(--status-warn); }
.banner.crit-b { border-left-color: var(--status-crit); }
.ico { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; margin-right: 7px; vertical-align: -3px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--sheet); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

/* Add flight: step by step, typed */
.wiz { position: fixed; inset: 0; z-index: 44; background: var(--paper); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.wiz-date { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: var(--pen); font-family: var(--font-num); font-size: 15px; cursor: pointer; }
.wiz-date input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.panel-body > .seg { justify-self: start; }
.date-btn { position: relative; justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 14px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--paper); color: var(--ink); font-family: var(--font-num); font-size: 14px; cursor: pointer; }
.date-btn input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }

.toast { display: flex; align-items: center; gap: 14px; width: max-content; }

/* Copy mode */
.copy { position: fixed; inset: 0; z-index: 45; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.copy-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.copy-head h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.copy-head h2:focus { outline: none; }
.brand h1, .sheet-title, .card h2, .panel-head h2, .copy-head h2, .wiz-q { font-family: var(--font-head); }
.copy-prog { font-family: var(--font-num); font-size: 12.5px; color: var(--ink-2); }
.copy-body { flex: 1; overflow-y: auto; padding-top: 14px; padding-bottom: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }

.copy-side { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; }

.copy-side h3 span { color: var(--ink-2); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
.copy-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; margin: 0; }
.copy-grid .half { grid-column: span 2; }
.copy-grid .full { grid-column: 1 / -1; }
.copy-grid dt, .copy-cols dt { font-size: 11px; color: var(--ink-2); }
.copy-grid dd { margin: 2px 0 0; font-family: var(--font-num); font-size: 19px; font-weight: 700; color: var(--pen); overflow-wrap: anywhere; }
.copy-grid .blank { font-family: var(--font-ui); font-size: 12px; font-weight: 400; color: var(--ink-2); }
.copy-cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0; text-align: center; }
.copy-cols > div { border: 1px solid var(--rule); border-radius: 6px; padding: 6px 1px; background: var(--paper); }
